name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-tests:
    name: Source and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: codex-terminal/image-service/package-lock.json
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Validate shell and Python syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            case "$(head -n 1 "$file")" in
              *python*) python -m py_compile "$file" ;;
              *bash*) bash -n "$file" ;;
              *'/sh'|*' sh') sh -n "$file" ;;
            esac
          done < <(find codex-terminal/scripts config/scripts dev -type f -print0)
          bash -n codex-terminal/run.sh

      - name: Validate YAML and JSON
        shell: bash
        run: |
          ruby -e 'require "yaml"; %w[repository.yaml codex-terminal/config.yaml].each { |path| YAML.safe_load(File.read(path), permitted_classes: [], aliases: false, filename: path); puts "#{path}: ok" }'
          python -m json.tool config/options.json >/dev/null

      - name: Run Python tests
        run: python -m unittest discover -s codex-terminal/scripts/tests -p 'test_*.py' -v

      - name: Install image-service dependencies
        working-directory: codex-terminal/image-service
        run: npm ci --no-audit --no-fund

      - name: Run image-service tests
        working-directory: codex-terminal/image-service
        run: npm test

      - name: Audit production dependencies
        working-directory: codex-terminal/image-service
        run: npm audit --omit=dev --audit-level=high

  container-build:
    name: Container (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build image
        shell: bash
        run: |
          platform='${{ matrix.platform }}'
          arch="${platform#linux/}"
          docker buildx build \
            --platform "$platform" \
            --pull \
            --load \
            --tag "local/codex-terminal-pro:${arch}" \
            ./codex-terminal
          docker run --rm --platform "$platform" "local/codex-terminal-pro:${arch}" codex --version

      - name: Smoke-test startup and process supervision
        if: matrix.platform == 'linux/amd64'
        shell: bash
        run: bash codex-terminal/scripts/tests/container-smoke.sh local/codex-terminal-pro:amd64
