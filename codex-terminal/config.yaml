---
name: "Codex Terminal Pro"
description: "Unofficial OpenAI Codex CLI terminal for Home Assistant with persistent package management, Home Assistant utilities, and image paste support."
version: "1.46"
slug: "codex_terminal_pro"
init: false

# Supported architectures
# armv7 is intentionally omitted for the MVP because Codex Linux binary
# availability is documented for x86_64 and arm64 only.
arch:
  - aarch64
  - amd64

# External resources
url: "https://github.com/jgassens/codex-terminal-pro"

# Web interface configuration
ingress: true
ingress_port: 7680
ingress_entry: /
ingress_stream: true
panel_icon: mdi:code-braces-box
panel_title: "Codex Terminal Pro"
panel_admin: true

# Port configuration
ports:
  7680/tcp: null
  7681/tcp: null
ports_description:
  7680/tcp: "Image upload service and web interface"
  7681/tcp: "ttyd terminal (embedded in web interface)"

# Add-on configuration options
options:
  auto_launch_codex: true
  terminal_transcript_enabled: true
  terminal_transcript_max_bytes: 1048576
  terminal_transcript_backups: 2
  terminal_history_limit: 50000
  image_retention_days: 30
  image_retention_max_bytes: 268435456
  supervisor_broker_enabled: true
  supervisor_broker_t1_ttl_seconds: 120
  supervisor_broker_comma_dispatch_enabled: true
  persistent_apk_packages: []
  persistent_pip_packages: []

schema:
  auto_launch_codex: bool?
  terminal_transcript_enabled: bool?
  terminal_transcript_max_bytes: int?
  terminal_transcript_backups: int?
  terminal_history_limit: int?
  image_retention_days: int?
  image_retention_max_bytes: int?
  supervisor_broker_enabled: bool?
  supervisor_broker_t1_ttl_seconds: int?
  supervisor_broker_comma_dispatch_enabled: bool?
  persistent_apk_packages:
    - str?
  persistent_pip_packages:
    - str?

# Volume mappings for file access
map:
  - config:rw    # Access to Home Assistant configuration files

# API access for Home Assistant integration
hassio_api: true
hassio_role: manager
homeassistant_api: true

# Service startup configuration
startup: services

# Web UI access URL
webui: http://[HOST]:[PORT:7680]/
