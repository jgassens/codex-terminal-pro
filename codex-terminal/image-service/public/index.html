                lastPrintableKey = { text: event.key, at: Date.now() };
            }

            return true;
        }

        function trackTerminalPromptKeydown(event) {
            if (!claimTerminalEvent(event)) {
                return;
            }

            handleTerminalPromptKeydown(event, 'dom-keydown');
        }

        function trackTerminalPromptBeforeInput(event) {
            if (!claimTerminalEvent(event)) {
                return;
            }

            if (event.defaultPrevented || event.isComposing) {
                return;
            }

            if (terminalMode !== 'codex') {
                resetTerminalLineBuffer();
                return;
            }

            if (event.inputType === 'insertLineBreak') {
                dispatchTerminalLineBuffer(event);
                return;
            }

            if (event.inputType === 'deleteContentBackward') {
                if (shouldProcessTerminalEditSource('beforeinput')) {
                    terminalLineBuffer = terminalLineBuffer.slice(0, -1);
                }
                return;
            }

            if (event.inputType === 'deleteContentForward') {
                return;
            }

            if (event.inputType === 'insertText' || event.inputType === 'insertCompositionText') {
                appendTerminalLineText(event.data || '', 'beforeinput');
                return;
            }

            if (event.inputType === 'insertFromPaste') {
                const pastedText = event.data || '';
                const safeText = promptPasteText(pastedText);
                if (safeText !== pastedText) {
                    stopTerminalInputEvent(event);
                    if (!safeText) {
                        return;
                    }

                    appendTerminalLineText(safeText, 'beforeinput');
                    lastPasteText = { text: safeText, at: Date.now() };
                    pasteTextIntoTerminal(safeText).then((inserted) => {
                        setStatus(inserted ? 'Pasted text into command line' : 'Could not paste into terminal', inserted ? 'success' : 'error', false);
                        if (inserted) {
                            focusTerminal(true);
                            scheduleTerminalViewportSync(true);
                        }
                    });
                    return;
                }

                appendTerminalLineText(safeText, 'beforeinput');
            }
        }

        function trackTerminalPromptPaste(event) {
            if (!claimTerminalEvent(event)) {
                return;
            }

            if (event.defaultPrevented || terminalMode !== 'codex') {
                return;
            }

            const text = event.clipboardData?.getData('text/plain') || '';
            if (!text) {
                return;
            }

            const safeText = promptPasteText(text);
            if (safeText !== text) {
                stopTerminalInputEvent(event);
                if (!safeText) {
                    return;
                }

                appendTerminalLineText(safeText, 'paste');
                lastPasteText = { text: safeText, at: Date.now() };
                pasteTextIntoTerminal(safeText).then((inserted) => {
                    setStatus(inserted ? 'Pasted text into command line' : 'Could not paste into terminal', inserted ? 'success' : 'error', false);
                    if (inserted) {
                        focusTerminal(true);
                        scheduleTerminalViewportSync(true);
                    }
                });
                return;
            }

            appendTerminalLineText(safeText, 'paste');
            lastPasteText = { text: safeText, at: Date.now() };
        }

        function resizeMobileTerminalInput() {
            if (!mobileTerminalInput) {
                return;
            }

            mobileTerminalInput.style.height = 'auto';
            mobileTerminalInput.style.height = `${Math.min(mobileTerminalInput.scrollHeight, 120)}px`;
        }

        function focusMobileTerminalInput() {
            if (!isMobileInputMode()) {
                return false;
            }

            mobileTerminalInput.focus({ preventScroll: true });
            resizeMobileTerminalInput();
            return true;
        }

        function insertTextIntoMobileInput(text) {
            if (!isMobileInputMode() || !text) {
                return false;
            }

            const value = mobileTerminalInput.value;
            const start = Number.isInteger(mobileTerminalInput.selectionStart)
                ? mobileTerminalInput.selectionStart
                : value.length;
            const end = Number.isInteger(mobileTerminalInput.selectionEnd)
                ? mobileTerminalInput.selectionEnd
                : start;

            mobileTerminalInput.value = `${value.slice(0, start)}${text}${value.slice(end)}`;
            const cursor = start + text.length;
            mobileTerminalInput.setSelectionRange(cursor, cursor);
            resizeMobileTerminalInput();
            focusMobileTerminalInput();
            return true;
        }

        async function sendMobileInput() {
            if (!mobileTerminalInput || !mobileTerminalInput.value.trim()) {
                setStatus('No command to send', 'error', false);
                focusMobileTerminalInput();
                return;
            }

            const text = mobileTerminalInput.value;
            const shellCommand = shellCommandFromDispatchPrefix(text);
            if (shellCommand !== null) {
                if (!shellCommand) {
                    setStatus(`Type a shell command after ${SHELL_DISPATCH_PREFIX}`, 'error', false);
                    focusMobileTerminalInput();
                    return;
                }

                mobileSendBtn.disabled = true;
                try {
                    const dispatched = await dispatchShellCommand(shellCommand);
                    if (dispatched) {
                        mobileTerminalInput.value = '';
                        resizeMobileTerminalInput();
                    }
                    focusMobileTerminalInput();
                } finally {
                    mobileSendBtn.disabled = false;
                }
                return;
            }

            mobileSendBtn.disabled = true;

            try {
                const pasted = await pasteTextIntoTerminal(text);
                if (!pasted) {
                    setStatus('Could not send command', 'error', false);
                    return;
                }

                if (!text.endsWith('\n')) {
                    const entered = await sendTerminalControl('enter');
                    if (!entered) {
                        setStatus('Command inserted, but Enter failed', 'error', false);
                        return;
                    }
                }

                mobileTerminalInput.value = '';
                resizeMobileTerminalInput();
                setStatus('Sent command', 'success', false);
                scheduleTerminalViewportSync(true);
                focusMobileTerminalInput();
            } finally {
                mobileSendBtn.disabled = false;
            }
        }

        mobileTerminalInput?.addEventListener('input', resizeMobileTerminalInput);
        mobileTerminalInput?.addEventListener('focus', () => {
            scheduleTerminalViewportSync(true);
        });
        mobileTerminalInput?.addEventListener('keydown', (event) => {
            if (
                event.key === 'Enter' &&
                !event.shiftKey &&
                !event.ctrlKey &&
                !event.altKey &&
                !event.metaKey
            ) {
                event.preventDefault();
                sendMobileInput();
            }
        });
        mobileInputRow?.addEventListener('submit', (event) => {
            event.preventDefault();
            sendMobileInput();
        });
        terminalModeButtons.forEach((button) => {
            button.addEventListener('click', () => {
                switchTerminalMode(button.getAttribute('data-terminal-mode'));
            });
        });

        function installTerminalSelectionCopy() {
            const iframe = document.getElementById('terminal-frame');

            iframe.addEventListener('load', () => {
                setTimeout(() => {
                    let iframeWindow;
                    let iframeDocument;
                    let lastKnownTerminalSelection = '';
                    let dragStartCell = null;
                    let touchSelectStartCell = null;
                    let touchSelectCurrentCell = null;

                    try {
                        iframeWindow = iframe.contentWindow;
                        iframeDocument = iframeWindow?.document;
                    } catch (err) {
                        console.log('Cannot attach terminal selection copier:', err);
                        return;
                    }

                    if (!iframeWindow || !iframeDocument) {
                        return;
                    }

                    if (iframeWindow.__codexTerminalSelectionCopyInstalled) {
                        return;
                    }
                    iframeWindow.__codexTerminalSelectionCopyInstalled = true;

                    const rememberTerminalSelection = () => {
                        const selectedText = getTerminalSelection(iframeWindow);
                        if (selectedText.trim()) {
                            lastKnownTerminalSelection = selectedText;
                        }
                    };

                    const copyTerminalSelection = () => {
                        if (touchSelectionMode) {
                            return;
                        }

                        rememberTerminalSelection();
                        const selectedText = getTerminalSelection(iframeWindow) || lastKnownTerminalSelection;

                        if (!selectedText.trim()) {
                            copyTerminalSelectionWithTtyd(iframeDocument);
                            return;
                        }

                        const now = Date.now();
                        if (
                            selectedText === lastCopiedTerminalSelection &&
                            now - lastCopiedTerminalSelectionAt < 1000
                        ) {
                            return;
                        }

                        const copyResult = copyToClipboardFromGesture(selectedText, iframeDocument);
                        if (copyResult && typeof copyResult.then === 'function') {
                            copyResult.then((copied) => {
                                updateTerminalSelectionCopyStatus(copied, selectedText);
                            });
                        } else {
                            updateTerminalSelectionCopyStatus(Boolean(copyResult), selectedText);
                        }
                    };

                    const rememberDragStart = (event) => {
                        if (event.button !== 0) {
                            return;
                        }
                        dragStartCell = getTerminalCellFromMouseEvent(iframeWindow, event);
                    };

                    const copyDraggedTerminalText = (event) => {
                        rememberTerminalSelection();
                        const dragEndCell = getTerminalCellFromMouseEvent(iframeWindow, event);
                        const draggedText = getTerminalTextFromDrag(iframeWindow, dragStartCell, dragEndCell);
                        dragStartCell = null;

                        if (draggedText.trim()) {
                            const copyResult = copyToClipboardFromGesture(draggedText, iframeDocument);
                            if (copyResult && typeof copyResult.then === 'function') {
                                copyResult.then((copied) => {
                                    updateTerminalSelectionCopyStatus(copied, draggedText);
                                });
                            } else {
                                updateTerminalSelectionCopyStatus(Boolean(copyResult), draggedText);
                            }
                            return;
                        }

                        copyTerminalSelection();
                    };

                    const rememberTouchSelectionStart = (event) => {
                        if (!touchSelectionMode || event.touches.length !== 1) {
                            return;
                        }

                        touchSelectStartCell = getTerminalCellFromTouchEvent(iframeWindow, event);
                        touchSelectCurrentCell = touchSelectStartCell;

                        if (!touchSelectStartCell) {
                            return;
                        }

                        event.preventDefault();
                        event.stopPropagation();
                        selectTerminalRange(iframeWindow, touchSelectStartCell, touchSelectCurrentCell);
                        setStatus('Drag to select terminal text', 'success', false);
                    };

                    const updateTouchSelection = (event) => {
                        if (!touchSelectionMode || !touchSelectStartCell || event.touches.length !== 1) {
                            return;
                        }

                        const currentCell = getTerminalCellFromTouchEvent(iframeWindow, event);
                        if (!currentCell) {
                            return;
                        }

                        touchSelectCurrentCell = currentCell;
                        event.preventDefault();
                        event.stopPropagation();
                        selectTerminalRange(iframeWindow, touchSelectStartCell, touchSelectCurrentCell);
                    };

                    const finishTouchSelection = (event) => {
                        if (!touchSelectionMode || !touchSelectStartCell) {
                            return;
                        }

                        const startCell = touchSelectStartCell;
                        const endCell = getTerminalCellFromTouchEvent(iframeWindow, event) || touchSelectCurrentCell;
                        event.preventDefault();
                        event.stopPropagation();

                        const selectedText = getTerminalTextFromDrag(iframeWindow, startCell, endCell);
                        selectTerminalRange(iframeWindow, startCell, endCell);
                        touchSelectStartCell = null;
                        touchSelectCurrentCell = null;
                        setTouchSelectionMode(false);

                        if (!selectedText.trim()) {
                            setStatus('No terminal text selected', 'error', false);
                            return;
                        }

                        const copyResult = copyToClipboardFromGesture(selectedText, iframeDocument);
                        if (copyResult && typeof copyResult.then === 'function') {
                            copyResult.then((copied) => {
                                updateTerminalSelectionCopyStatus(copied, selectedText, {
                                    selectionReadyMessage: 'Text selected. Use the selection handles to Copy if needed.'
                                });
                            });
                        } else {
                            updateTerminalSelectionCopyStatus(Boolean(copyResult), selectedText, {
                                selectionReadyMessage: 'Text selected. Use the selection handles to Copy if needed.'
                            });
                        }
                    };

                    iframeDocument.addEventListener('selectionchange', rememberTerminalSelection, true);
                    iframeWindow.addEventListener('keydown', trackTerminalPromptKeydown, { capture: true });
                    iframeWindow.addEventListener('beforeinput', trackTerminalPromptBeforeInput, { capture: true });
                    iframeWindow.addEventListener('paste', trackTerminalPromptPaste, { capture: true });
                    iframeDocument.addEventListener('keydown', trackTerminalPromptKeydown, { capture: true });
                    iframeDocument.addEventListener('beforeinput', trackTerminalPromptBeforeInput, { capture: true });
                    iframeDocument.addEventListener('paste', trackTerminalPromptPaste, { capture: true });
                    iframeDocument.addEventListener('mousedown', rememberDragStart, true);
                    iframeDocument.addEventListener('mouseup', copyDraggedTerminalText, true);
                    iframeDocument.addEventListener('touchstart', rememberTouchSelectionStart, { capture: true, passive: false });
                    iframeDocument.addEventListener('touchmove', updateTouchSelection, { capture: true, passive: false });
                    iframeDocument.addEventListener('touchcancel', finishTouchSelection, { capture: true, passive: false });
                    iframeDocument.addEventListener('touchend', copyTerminalSelection, true);
                    iframeDocument.addEventListener('touchend', finishTouchSelection, { capture: true, passive: false });
                    iframeDocument.addEventListener('keyup', (event) => {
                        if (event.key === 'Shift' || event.key.startsWith('Arrow') || event.key === 'PageUp' || event.key === 'PageDown') {
                            rememberTerminalSelection();
                            copyTerminalSelection();
                        }
                    }, true);

                    installMobileTerminalScroll(iframeWindow, iframeDocument);

                    waitForTerminalApi(iframeWindow, () => {
                        try {
                            iframeWindow.term.onSelectionChange(rememberTerminalSelection);
                        } catch (err) {
                            console.log('Cannot attach xterm selection tracker:', err);
                        }

                        try {
                            if (
                                typeof iframeWindow.term.attachCustomKeyEventHandler === 'function' &&
                                !iframeWindow.__codexShellDispatchKeyHandlerInstalled
                            ) {
                                iframeWindow.__codexShellDispatchKeyHandlerInstalled = true;
                                iframeWindow.term.attachCustomKeyEventHandler((event) => {
                                    if (!claimTerminalEvent(event)) {
                                        return true;
                                    }

                                    return handleTerminalPromptKeydown(event, 'xterm-keydown');
                                });
                            }
                        } catch (err) {
                            console.log('Cannot attach xterm shell dispatch key handler:', err);
                        }

                        installOsc52ClipboardBridge(iframeWindow, iframeDocument);
                    });
                }, 500);
            });
        }

        function installMobileTerminalScroll(iframeWindow, iframeDocument) {
            if (!iframeWindow || !iframeDocument || iframeWindow.__codexMobileScrollInstalled) {
                return;
            }

            iframeWindow.__codexMobileScrollInstalled = true;
            let touchStartY = null;
            let scrollRequestPending = false;
            let lastScrollAt = 0;
            const scrollThreshold = 54;
            const scrollThrottleMs = 140;

            const sendTouchScroll = (action) => {
                const now = Date.now();
                if (scrollRequestPending || now - lastScrollAt < scrollThrottleMs) {
                    return;
                }

                scrollRequestPending = true;
                lastScrollAt = now;
                sendTerminalControl(action)
                    .then((ok) => {
                        if (!ok) {
                            setStatus('Could not scroll terminal', 'error', false);
                        }
                    })
                    .catch((err) => {
                        console.log('Touch terminal scroll failed:', err);
                        setStatus('Could not scroll terminal', 'error', false);
                    })
                    .finally(() => {
                        scrollRequestPending = false;
                    });
            };

            iframeDocument.addEventListener('touchstart', (event) => {
                if (!rootElement.classList.contains('touch-ui') || touchSelectionMode || event.touches.length !== 1) {
                    touchStartY = null;
                    return;
                }

                touchStartY = event.touches[0].clientY;
            }, { capture: true, passive: true });

            iframeDocument.addEventListener('touchmove', (event) => {
                if (!rootElement.classList.contains('touch-ui') || touchSelectionMode || event.touches.length !== 1 || touchStartY === null) {
                    return;
                }

                const currentY = event.touches[0].clientY;
                const deltaY = currentY - touchStartY;
                if (Math.abs(deltaY) < scrollThreshold) {
                    return;
                }

                event.preventDefault();
                event.stopPropagation();
                sendTouchScroll(deltaY > 0 ? 'scroll-up' : 'scroll-down');
                touchStartY = currentY;
            }, { capture: true, passive: false });

            iframeDocument.addEventListener('touchend', () => {
                touchStartY = null;
            }, true);
            iframeDocument.addEventListener('touchcancel', () => {
                touchStartY = null;
            }, true);
        }

        function setTouchSelectionMode(enabled) {
            touchSelectionMode = Boolean(enabled);
            if (touchSelectBtn) {
                touchSelectBtn.classList.toggle('active', touchSelectionMode);
                touchSelectBtn.setAttribute('aria-pressed', touchSelectionMode ? 'true' : 'false');
            }

            if (touchSelectionMode) {
                setStatus('Select mode: touch-drag terminal text', 'success', true);
            } else if (status.textContent === 'Select mode: touch-drag terminal text') {
                setStatus('');
            }
        }

        touchSelectBtn?.addEventListener('click', () => {
            setTouchSelectionMode(!touchSelectionMode);
        });

        function copyTerminalSelectionWithTtyd(iframeDocument) {
            try {
                return iframeDocument.execCommand('copy');
            } catch (err) {
                console.log('Cannot trigger ttyd terminal copy:', err);
                return false;
            }
        }

        function installOsc52ClipboardBridge(iframeWindow, iframeDocument) {
            const term = iframeWindow.term;
            if (
                !term ||
                !term.parser ||
                typeof term.parser.registerOscHandler !== 'function' ||
                iframeWindow.__codexOsc52ClipboardInstalled
            ) {
                return;
            }

            iframeWindow.__codexOsc52ClipboardInstalled = true;

            term.parser.registerOscHandler(52, (data) => {
                const text = decodeOsc52ClipboardData(data);
                if (!text) {
                    return false;
                }

                const copyResult = copyToClipboardFromGesture(text, iframeDocument);
                if (copyResult && typeof copyResult.then === 'function') {
                    copyResult.then((copied) => {
                        updateTerminalSelectionCopyStatus(copied, text);
                    });
                } else {
                    updateTerminalSelectionCopyStatus(Boolean(copyResult), text);
                }

                return true;
            });
        }

        function decodeOsc52ClipboardData(data) {
            const separator = data.indexOf(';');
            if (separator === -1) {
                return '';
            }

            const encoded = data.slice(separator + 1);
            if (!encoded || encoded === '?') {
                return '';
            }

            try {
                const binary = atob(encoded);
                const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
                return new TextDecoder().decode(bytes).replace(/\u00a0/g, ' ');
            } catch (err) {
                console.log('Cannot decode OSC 52 clipboard data:', err);
                return '';
            }
        }

        function waitForTerminalApi(iframeWindow, callback, attempt = 0) {
            if (iframeWindow.term && typeof iframeWindow.term.getSelection === 'function') {
                callback();
                return;
            }

            if (attempt >= 40) {
                console.log('ttyd terminal API was not available for selection copy');
                return;
            }

            setTimeout(() => waitForTerminalApi(iframeWindow, callback, attempt + 1), 250);
        }

        function getTerminalSelection(iframeWindow) {
            let selectedText = '';

            try {
                if (iframeWindow.term && typeof iframeWindow.term.getSelection === 'function') {
                    selectedText = String(iframeWindow.term.getSelection() || '');
                }
            } catch (err) {
                console.log('Cannot read xterm selection:', err);
            }

            if (!selectedText) {
                try {
                    selectedText = String(iframeWindow.getSelection()?.toString() || '');
                } catch (err) {
                    console.log('Cannot read terminal document selection:', err);
                }
            }

            return selectedText.replace(/\u00a0/g, ' ');
        }

        function getTerminalCellFromMouseEvent(iframeWindow, event) {
            return getTerminalCellFromPoint(iframeWindow, event.clientX, event.clientY);
        }

        function getTerminalCellFromTouchEvent(iframeWindow, event) {
            const touch = event.touches?.[0] || event.changedTouches?.[0];
            if (!touch) {
                return null;
            }

            return getTerminalCellFromPoint(iframeWindow, touch.clientX, touch.clientY);
        }

        function getTerminalCellFromPoint(iframeWindow, clientX, clientY) {
            const term = iframeWindow.term;
            if (!term || !term.cols || !term.rows) {
                return null;
            }

            const screen = iframeWindow.document.querySelector('.xterm-screen') ||
                iframeWindow.document.querySelector('.xterm') ||
                iframeWindow.document.querySelector('.terminal');
            if (!screen) {
                return null;
            }

            const rect = screen.getBoundingClientRect();
            if (
                clientX < rect.left ||
                clientX > rect.right ||
                clientY < rect.top ||
                clientY > rect.bottom
            ) {
                return null;
            }

            const cellWidth = rect.width / term.cols;
            const cellHeight = rect.height / term.rows;
            if (!cellWidth || !cellHeight) {
                return null;
            }

            return {
                col: Math.max(0, Math.min(term.cols - 1, Math.floor((clientX - rect.left) / cellWidth))),
                row: Math.max(0, Math.min(term.rows - 1, Math.floor((clientY - rect.top) / cellHeight)))
            };
        }

        function orderedTerminalCells(startCell, endCell) {
            if (!startCell || !endCell) {
                return { start: null, end: null };
            }

            const start = (startCell.row < endCell.row ||
                (startCell.row === endCell.row && startCell.col <= endCell.col)) ? startCell : endCell;
            const end = start === startCell ? endCell : startCell;
            return { start, end };
        }

        function selectTerminalRange(iframeWindow, startCell, endCell) {
            const term = iframeWindow.term;
            const buffer = term?.buffer?.active;
            if (!term || typeof term.select !== 'function' || !buffer || !startCell || !endCell) {
                return false;
            }

            const { start, end } = orderedTerminalCells(startCell, endCell);
            if (!start || !end) {
                return false;
            }

            const rowDelta = Math.max(0, end.row - start.row);
            const length = Math.max(1, (rowDelta * term.cols) + (end.col - start.col) + 1);
            term.select(start.col, (buffer.viewportY || 0) + start.row, length);
            return true;
        }

        function getTerminalTextFromDrag(iframeWindow, startCell, endCell) {
            const term = iframeWindow.term;
            const buffer = term?.buffer?.active;
            if (!buffer || !startCell || !endCell) {
                return '';
            }

            if (startCell.row === endCell.row && Math.abs(startCell.col - endCell.col) < 1) {
                return '';
            }

            const { start, end } = orderedTerminalCells(startCell, endCell);
            const viewportY = buffer.viewportY || 0;
            const parts = [];

            for (let row = start.row; row <= end.row; row += 1) {
                const line = buffer.getLine(viewportY + row);
                if (!line) {
                    continue;
                }

                const nextLine = row < end.row ? buffer.getLine(viewportY + row + 1) : null;
                const text = line.translateToString(false).replace(/\u00a0/g, ' ');
                let selected = '';
                if (row === start.row && row === end.row) {
                    selected = text.slice(start.col, end.col + 1);
                } else if (row === start.row) {
                    selected = text.slice(start.col);
                } else if (row === end.row) {
                    selected = text.slice(0, end.col + 1);
                } else {
                    selected = text;
                }

                const joinsPreviousRow = row > start.row && line.isWrapped;
                const continuesIntoNextRow = Boolean(nextLine?.isWrapped);
                if (parts.length > 0 && !joinsPreviousRow) {
                    parts.push('\n');
                }

                parts.push(continuesIntoNextRow ? selected : selected.trimEnd());
            }

            return parts.join('').trim();
        }

        function updateTerminalSelectionCopyStatus(copied, selectedText, options = {}) {
            if (copied) {
                lastCopiedTerminalSelection = selectedText;
                lastCopiedTerminalSelectionAt = Date.now();
                setStatus('Copied terminal selection', 'success', false);
            } else if (options.selectionReadyMessage) {
                lastCopiedTerminalSelection = selectedText;
                lastCopiedTerminalSelectionAt = Date.now();
                setStatus(options.selectionReadyMessage, 'success', false);
            } else if (options.showManualFallback) {
                lastCopiedTerminalSelection = selectedText;
                lastCopiedTerminalSelectionAt = Date.now();
                showManualCopy(selectedText, 'Copy failed. Tap and hold to Copy, or use the selected text below.');
                setStatus('Selection ready for manual copy', 'error', false);
            } else {
                lastCopiedTerminalSelection = selectedText;
                lastCopiedTerminalSelectionAt = Date.now();
                setStatus('');
            }
        }

        function copyToClipboardFromGesture(text, clipboardDocument = document) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                return navigator.clipboard.writeText(text)
                    .then(() => true)
                    .catch((err) => {
                        console.log('Clipboard API failed:', err);
                        return fallbackCopyToClipboard(text, clipboardDocument);
                    });
            }

            return fallbackCopyToClipboard(text, clipboardDocument);
        }

        function isImageFile(file) {
            if (!file) {
                return false;
            }

            if (file.type && file.type.startsWith('image/')) {
                return true;
            }

            return /\.(heic|heif|jpe?g|png|gif|webp|svg)$/i.test(file.name || '');
        }

        function imageFilesFromFileList(fileList) {
            return Array.from(fileList || []).filter(isImageFile);
        }

        function imageFilesFromItems(items) {
            return Array.from(items || [])
                .filter((item) => item.kind === 'file' && typeof item.getAsFile === 'function')
                .map((item) => item.getAsFile())
                .filter(isImageFile);
        }

        function imageFilesFromTransfer(transfer) {
            if (!transfer) {
                return [];
            }

            const files = [
                ...imageFilesFromFileList(transfer.files),
                ...imageFilesFromItems(transfer.items)
            ];
            const seen = new Set();

            return files.filter((file) => {
                const key = `${file.name || 'image'}:${file.type || 'unknown'}:${file.size}:${file.lastModified || 0}`;
                if (seen.has(key)) {
                    return false;
                }
                seen.add(key);
                return true;
            });
        }

        function imageFilesFromEvent(e) {
            return [
                ...imageFilesFromTransfer(e.clipboardData),
                ...imageFilesFromTransfer(e.dataTransfer)
            ];
        }

        function imagePasteSignature(files) {
            return files
                .map((file) => `${file.name || 'image'}:${file.type || 'unknown'}:${file.size}:${file.lastModified || 0}`)
                .join('|');
        }

        async function uploadImageFiles(files, sourceLabel = 'selected') {
            const imageFiles = imageFilesFromFileList(files);

            if (imageFiles.length === 0) {
                setStatus('Please paste or drop an image file', 'error');
                return;
            }

            if (imageFiles.length > 1) {
                setStatus(`Uploading ${imageFiles.length} images...`, 'success');
            } else if (sourceLabel === 'pasted') {
                setStatus('Uploading pasted image...', 'success');
            }

            for (const file of imageFiles) {
                await uploadImage(file);
            }
        }

        async function uploadImage(file) {
            if (!isImageFile(file)) {
                setStatus('Please paste or drop an image file', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('image', file);
            setStatus('Uploading image...', 'success', false);

            try {
                // Use relative path for Home Assistant ingress compatibility
                const response = await fetch(ingressPath('upload'), {
                    method: 'POST',
                    body: formData
                });

                // Check if response is ok (status 200-299)
                if (!response.ok) {
                    const text = await response.text();
                    let errorMessage = 'Upload failed';
                    try {
                        const errorJson = JSON.parse(text);
                        errorMessage = errorJson.error || errorMessage;
                    } catch {
                        errorMessage = text || errorMessage;
                    }
                    throw new Error(errorMessage);
                }

                const result = await response.json();

                if (result.success) {
                    const filePath = result.path;

                    // Display full path persistently with click-to-copy functionality
                    setStatus(`📋 ${filePath} (click to select)`, 'success', true);
                    console.log('Image uploaded:', filePath);

                    // Make status clickable to copy or manually select text.
                    status.style.cursor = 'pointer';
                    status.style.userSelect = 'text';

                    status.onclick = async () => {
                        const copied = await copyToClipboard(filePath);
                        if (copied) {
                            const originalText = status.textContent;
                            setStatus('✓ Copied!', 'success', false);
                            setTimeout(() => {
                                setStatus(originalText, 'success', true);
                            }, 2000);
                        } else {
                            showManualCopy(filePath, 'Tap and hold the path to Copy, then paste it into the terminal.');
                        }
                    };

                    if (insertTextIntoMobileInput(`${filePath} `)) {
                        await copyToClipboard(filePath);
                        setStatus(`📎 Added ${filePath} to command line`, 'success', true);
                        return;
                    }

                    const inserted = await insertTextIntoTerminal(`${filePath} `);
                    if (inserted) {
                        await copyToClipboard(filePath);
                        setStatus(`📎 Inserted ${filePath}`, 'success', true);
                        focusTerminal(true);
                        scheduleTerminalViewportSync(true);
                    } else {
                        const copied = await copyToClipboard(filePath);
                        if (copied) {
                            setStatus(`📋 ${filePath} copied. Paste it into the terminal.`, 'success', true);
                        } else {
                            showManualCopy(filePath, 'Tap and hold the path to Copy, then paste it into the terminal.');
                        }
                    }
                } else {
                    setStatus(result.error || 'Upload failed', 'error');
                }
            } catch (error) {
                console.error('Upload error:', error);
                setStatus('Upload failed: ' + error.message, 'error');
            }
        }

        async function handleImagePaste(e) {
            if (
                e.type === 'beforeinput' &&
                e.inputType !== 'insertFromPaste' &&
                e.inputType !== 'insertFromDrop'
            ) {
                return false;
            }

            if (handledImagePasteEvents.has(e)) {
                return true;
            }

            const files = imageFilesFromEvent(e);
            if (files.length === 0) {
                return false;
            }

            const signature = imagePasteSignature(files);
            const now = Date.now();
            if (signature && signature === lastImagePasteSignature && now - lastImagePasteAt < 1500) {
                e.preventDefault();
                e.stopPropagation();
                handledImagePasteEvents.add(e);
                return true;
            }

            handledImagePasteEvents.add(e);
            lastImagePasteSignature = signature;
            lastImagePasteAt = now;
            e.preventDefault();
            e.stopPropagation();

            console.log('Image paste detected:', files.map((file) => file.type || file.name));
            await uploadImageFiles(files, 'pasted');
            return true;
        }

        // Paste handling. Capture phase matters because ttyd/xterm handles
        // paste inside an iframe before normal wrapper listeners can see it.
        document.addEventListener('paste', handleImagePaste, true);
        document.addEventListener('beforeinput', handleImagePaste, true);
        window.addEventListener('paste', handleImagePaste, true);
        window.addEventListener('beforeinput', handleImagePaste, true);

        // Drag and drop handling
        let dragCounter = 0;

        document.addEventListener('dragenter', (e) => {
            e.preventDefault();
            dragCounter++;
            if (dragCounter === 1) {
                dropZone.classList.add('active');
            }
        });

        document.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dragCounter--;
            if (dragCounter === 0) {
                dropZone.classList.remove('active');
            }
        });

        document.addEventListener('dragover', (e) => {
            e.preventDefault();
        });

        async function handleImageDrop(e) {
            e.preventDefault();
            dragCounter = 0;
            dropZone.classList.remove('active');

            const files = imageFilesFromTransfer(e.dataTransfer);
            if (files.length > 0) {
                await uploadImageFiles(files, 'dropped');
            } else {
                setStatus('Please drop an image file', 'error');
            }
        }

        document.addEventListener('drop', handleImageDrop);
        dropZone.addEventListener('dragover', (e) => e.preventDefault());
        dropZone.addEventListener('drop', handleImageDrop);

        async function insertTextIntoTerminal(text) {
            try {
                const response = await fetch(ingressPath('terminal-input'), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text })
                });

                if (!response.ok) {
                    const body = await response.text();
                    console.log('Terminal insert failed:', body);
                    return false;
                }

                const result = await response.json();
                return Boolean(result.success);
            } catch (err) {
                console.log('Terminal insert failed:', err);
                return false;
            }
        }

        async function pasteTextIntoTerminal(text) {
            try {
                const response = await fetch(ingressPath('terminal-paste'), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text })
                });

                if (!response.ok) {
                    const body = await response.text();
                    console.log('Terminal paste failed:', body);
                    return false;
                }

                const result = await response.json();
                return Boolean(result.success);
            } catch (err) {
                console.log('Terminal paste failed:', err);
                return false;
            }
        }

        async function sendTerminalControl(action) {
            try {
                const response = await fetch(ingressPath('terminal-control'), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ action })
                });

                if (!response.ok) {
                    const body = await response.text();
                    console.log('Terminal control failed:', body);
                    return false;
                }

                const result = await response.json();
                return Boolean(result.success);
            } catch (err) {
                console.log('Terminal control failed:', err);
                return false;
            }
        }

        async function clipboardImageFiles() {
            if (!navigator.clipboard || typeof navigator.clipboard.read !== 'function') {
                return [];
            }

            const items = await navigator.clipboard.read();
            const files = [];

            for (const item of items) {
                const imageType = item.types.find((type) => type.startsWith('image/'));
                if (!imageType) {
                    continue;
                }

                const blob = await item.getType(imageType);
                const extension = imageType.split('/')[1] || 'png';
                files.push(new File([blob], `clipboard-image.${extension}`, { type: imageType }));
            }

            return files;
        }

        async function pasteClipboardIntoTerminal() {
            manualPastePanel.classList.remove('active');
            setStatus('Reading clipboard...', 'success', false);

            try {
                const imageFiles = await clipboardImageFiles();
                if (imageFiles.length > 0) {
                    await uploadImageFiles(imageFiles, 'pasted');
                    return;
                }
            } catch (err) {
                console.log('Clipboard image read failed:', err);
            }

            if (navigator.clipboard && typeof navigator.clipboard.readText === 'function') {
                try {
                    const text = await navigator.clipboard.readText();
                    if (text.trim()) {
                        const safeText = promptPasteText(text);
                        if (!safeText.trim()) {
                            setStatus('Clipboard did not contain text or an image', 'error', false);
                            return;
                        }

                        if (insertTextIntoMobileInput(safeText)) {
                            setStatus('Pasted clipboard text into command line', 'success', false);
                            return;
                        }

                        const inserted = await pasteTextIntoTerminal(safeText);
                        setStatus(inserted ? 'Pasted clipboard text' : 'Could not paste into terminal', inserted ? 'success' : 'error', false);
                        if (inserted) {
                            focusTerminal(true);
                            scheduleTerminalViewportSync(true);
                        }
                        return;
                    }

                    setStatus('Clipboard did not contain text or an image', 'error', false);
                    return;
                } catch (err) {
                    console.log('Clipboard text read failed:', err);
                }
            }

            showManualPaste('');
            setStatus('Clipboard access blocked. Paste below, then tap Insert.', 'error', false);
        }

        // Helper to copy text to clipboard
        async function copyToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                try {
                    await navigator.clipboard.writeText(text);
                    return true;
                } catch (err) {
                    console.log('Clipboard API failed, trying fallback:', err);
                    return fallbackCopyToClipboard(text);
                }
            } else {
                return fallbackCopyToClipboard(text);
            }
        }

        // iOS-compatible fallback clipboard copy using execCommand.
        function fallbackCopyToClipboard(text, clipboardDocument = document) {
            const textArea = clipboardDocument.createElement('textarea');
            textArea.value = text;
            textArea.readOnly = false;
            textArea.contentEditable = 'true';
            textArea.style.position = 'fixed';
            textArea.style.top = '0';
            textArea.style.left = '0';
            textArea.style.width = '1px';
            textArea.style.height = '1px';
            textArea.style.opacity = '0';
            textArea.style.pointerEvents = 'none';
            clipboardDocument.body.appendChild(textArea);

            const selection = clipboardDocument.getSelection?.();
            const range = clipboardDocument.createRange?.();

            textArea.focus({ preventScroll: true });
            if (range && selection) {
                range.selectNodeContents(textArea);
                selection.removeAllRanges();
                selection.addRange(range);
            }
            textArea.setSelectionRange(0, text.length);

            try {
                const copied = clipboardDocument.execCommand('copy');
                clipboardDocument.body.removeChild(textArea);
                selection?.removeAllRanges();
                return copied;
            } catch (err) {
                clipboardDocument.body.removeChild(textArea);
                selection?.removeAllRanges();
                return false;
            }
        }

        function showManualCopy(text, message) {
            manualCopyText.value = text;
            manualCopyMessage.textContent = message || 'Tap and hold to Copy, then paste into the terminal.';
            manualCopyPanel.classList.add('active');
            manualCopyText.focus({ preventScroll: true });
            manualCopyText.select();
        }

        function showManualPaste(text = '') {
            manualPasteText.value = text;
            manualPastePanel.classList.add('active');
            updateViewportMetrics();
            manualPasteText.focus({ preventScroll: true });
        }

        changeDeskBtn.addEventListener('click', () => {
            loadChangeDesk();
        });

        changeDeskRefresh.addEventListener('click', () => {
            loadChangeDesk();
        });

        changeDeskCopy.addEventListener('click', copyChangeDeskSummary);

        changeDeskPrompt.addEventListener('click', insertChangeDeskPrompt);

        changeDeskClose.addEventListener('click', () => {
            changeDeskPanel.classList.remove('active');
            changeDeskBtn.classList.remove('active');
            focusMobileTerminalInput() || focusTerminal(false);
        });

        manualCopyDismiss.addEventListener('click', () => {
            manualCopyPanel.classList.remove('active');
        });

        manualPasteDismiss.addEventListener('click', () => {
            manualPastePanel.classList.remove('active');
        });

        shellOutputDismiss.addEventListener('click', () => {
            shellOutputPanel.classList.remove('active');
            focusMobileTerminalInput() || focusTerminal(false);
        });

        shellOutputCopy.addEventListener('click', async () => {
            if (!latestShellOutput) {
                setStatus('No shell output to copy', 'error', false);
                return;
            }

            const copied = await copyToClipboard(latestShellOutput);
            setStatus(copied ? 'Shell output copied' : 'Copy failed', copied ? 'success' : 'error', false);
            if (!copied) {
                showManualCopy(latestShellOutput, 'Copy failed. Tap and hold to Copy, or use the selected text below.');
            }
        });

        manualPasteInsert.addEventListener('click', async () => {
            const text = promptPasteText(manualPasteText.value);
            if (!text.trim()) {
                setStatus('No text to paste', 'error', false);
                return;
            }

            manualPasteInsert.disabled = true;

            if (insertTextIntoMobileInput(text)) {
                manualPastePanel.classList.remove('active');
                manualPasteText.value = '';
                manualPasteInsert.disabled = false;
                setStatus('Inserted pasted text into command line', 'success', false);
                return;
            }

            const inserted = await pasteTextIntoTerminal(text);
            manualPasteInsert.disabled = false;

            if (inserted) {
                manualPastePanel.classList.remove('active');
                manualPasteText.value = '';
                setStatus('Inserted pasted text', 'success', false);
                focusTerminal(true);
                scheduleTerminalViewportSync(true);
            } else {
                setStatus('Could not paste into terminal', 'error', false);
            }
        });

        pasteBtn.addEventListener('click', pasteClipboardIntoTerminal);

        document.querySelectorAll('[data-terminal-action]').forEach((button) => {
            button.addEventListener('pointerdown', () => {
                if (isMobileInputMode()) {
                    setTimeout(focusMobileTerminalInput, 0);
                }
            });
            button.addEventListener('click', async () => {
                const action = button.getAttribute('data-terminal-action');
                const ok = await sendTerminalControl(action);
                if (!ok) {
                    setStatus('Could not send terminal control', 'error', false);
                    return;
                }

                if (isMobileInputMode()) {
                    if (action === 'scroll-up') {
                        setStatus('Paged up', 'success', false);
                    } else if (action === 'scroll-down') {
                        setStatus('Paged down', 'success', false);
                    } else if (action === 'scroll-bottom') {
                        setStatus('Returned to prompt', 'success', false);
                    }

                    focusMobileTerminalInput();
                }
            });
        });

        // Forward image paste/drop events over the terminal iframe to the
        // wrapper upload flow. Without this, ttyd/xterm can swallow them before
        // the parent page sees them.
        window.addEventListener('load', () => {
            const iframe = document.getElementById('terminal-frame');
            iframe.addEventListener('pointerdown', () => {
                if (isMobileInputMode()) {
                    mobileTerminalInput.blur();
                }
            });
            iframe.addEventListener('dragover', (e) => e.preventDefault());
            iframe.addEventListener('drop', handleImageDrop);
            iframe.addEventListener('paste', handleImagePaste, true);
            iframe.addEventListener('beforeinput', handleImagePaste, true);
            iframe.addEventListener('load', () => {
                try {
                    const iframeDocument = iframe.contentWindow?.document;
                    if (!iframeDocument) {
                        return;
                    }

                    iframeDocument.addEventListener('dragover', (e) => e.preventDefault(), true);
                    iframeDocument.addEventListener('drop', handleImageDrop, true);
                    iframeDocument.addEventListener('paste', handleImagePaste, true);
                    iframeDocument.addEventListener('beforeinput', handleImagePaste, true);

                    if (iframe.contentWindow) {
                        iframe.contentWindow.addEventListener('paste', handleImagePaste, true);
                        iframe.contentWindow.addEventListener('beforeinput', handleImagePaste, true);
                    }
                } catch (err) {
                    console.log('Cannot attach terminal image handlers:', err);
                }
            });
        });

    </script>
</body>
