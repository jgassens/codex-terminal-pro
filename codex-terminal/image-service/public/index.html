<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codex Terminal Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #101314;
            --panel: #171b1d;
            --panel-strong: #202527;
            --border: #344044;
            --border-soft: #263033;
            --text: #f3efe2;
            --muted: #a7b0ac;
            --accent: #f0b45b;
            --accent-strong: #ffc86b;
            --accent-cool: #79c7c5;
            --success: #8ec07c;
            --danger: #fb6f5f;
            --button: #263c42;
            --button-hover: #315057;
            --button-active: #20343a;
            --shadow: rgba(0, 0, 0, 0.35);
            --app-height: 100vh;
            --keyboard-inset: 0px;
        }

        html[data-terminal-mode="raw"] {
            color-scheme: light;
            --bg: #fff8eb;
            --panel: #f6eee4;
            --panel-strong: #eadfd3;
            --border: #cdaea7;
            --border-soft: #ded0c7;
            --text: #111827;
            --muted: #5b5360;
            --accent: #174ea6;
            --accent-strong: #063b87;
            --accent-cool: #9f2f63;
            --success: #256e4d;
            --danger: #047b8d;
            --button: #ead2c8;
            --button-hover: #dfb9aa;
            --button-active: #e5c7bc;
            --shadow: rgba(58, 47, 40, 0.18);
        }

        html {
            height: 100%;
            overflow: hidden;
            background: var(--bg);
        }

        body {
            font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            height: var(--app-height);
            min-height: var(--app-height);
            width: 100%;
            position: fixed;
            inset: 0;
            overscroll-behavior: none;
        }

        #container {
            display: flex;
            flex-direction: column;
            height: var(--app-height);
            min-height: 0;
        }

        #header {
            background: var(--panel);
            padding: 9px 14px;
            border-bottom: 1px solid var(--border-soft);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            gap: 12px;
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.03), 0 10px 30px var(--shadow);
        }

        html[data-terminal-mode="raw"] #header {
            border-bottom-color: rgba(52, 64, 68, 0.22);
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.88), 0 10px 28px rgba(52, 64, 68, 0.12);
        }

        #header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            font-size: 14px;
            font-weight: 650;
            color: var(--text);
            white-space: nowrap;
        }

        .brand-mark {
            display: inline-grid;
            place-items: center;
            width: 30px;
            height: 24px;
            border: 1px solid rgba(121, 199, 197, 0.45);
            border-radius: 6px;
            color: var(--accent-cool);
            background: #11191b;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 12px;
            letter-spacing: 0;
        }

        html[data-terminal-mode="raw"] .brand-mark {
            border-color: rgba(159, 47, 99, 0.38);
            background: #fffdf7;
            color: var(--accent-cool);
            box-shadow: inset 0 -1px 0 rgba(12, 16, 29, 0.08);
        }

        .status-pill {
            color: var(--accent);
            background: rgba(240, 180, 91, 0.1);
            border: 1px solid rgba(240, 180, 91, 0.26);
            border-radius: 999px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
        }

        html[data-terminal-mode="raw"] .status-pill {
            color: var(--accent);
            background: rgba(15, 75, 164, 0.08);
            border-color: rgba(15, 75, 164, 0.24);
        }

        #header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        #terminal-mode-switch {
            display: flex;
            align-items: center;
            flex: 0 0 auto;
            padding: 2px;
            border: 1px solid rgba(121, 199, 197, 0.24);
            border-radius: 7px;
            background: #11191b;
        }

        html[data-terminal-mode="raw"] #terminal-mode-switch {
            background: #fffdf7;
            border-color: rgba(17, 24, 39, 0.18);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        .terminal-mode-btn {
            border: 0;
            border-radius: 5px;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            font-size: 12px;
            font-weight: 650;
            min-height: 28px;
            padding: 5px 9px;
        }

        .terminal-mode-btn.active {
            background: rgba(240, 180, 91, 0.2);
            color: var(--accent-strong);
        }

        html[data-terminal-mode="raw"] .terminal-mode-btn.active {
            background: linear-gradient(180deg, rgba(23, 78, 166, 0.18), rgba(23, 78, 166, 0.1));
            color: var(--accent-strong);
            box-shadow: inset 0 -1px 0 rgba(23, 78, 166, 0.18);
        }

        .terminal-mode-btn:disabled {
            cursor: wait;
            opacity: 0.65;
        }

        .header-btn {
            background: var(--button);
            color: var(--text);
            border: 1px solid rgba(121, 199, 197, 0.28);
            padding: 7px 11px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            min-height: 32px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        html[data-terminal-mode="raw"] .header-btn {
            border-color: rgba(159, 47, 99, 0.22);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55);
        }

        .header-btn:hover {
            background: var(--button-hover);
            border-color: rgba(121, 199, 197, 0.5);
        }

        html[data-terminal-mode="raw"] .header-btn:hover {
            border-color: rgba(159, 47, 99, 0.36);
        }

        .header-btn:active {
            background: var(--button-active);
        }

        .header-btn.active {
            background: rgba(240, 180, 91, 0.2);
            border-color: rgba(240, 180, 91, 0.65);
            color: var(--accent-strong);
        }

        html[data-terminal-mode="raw"] .header-btn.active {
            background: rgba(15, 75, 164, 0.1);
            border-color: rgba(15, 75, 164, 0.32);
            color: var(--accent-strong);
        }

        .header-btn:disabled {
            background: #2d3436;
            cursor: not-allowed;
            opacity: 0.5;
        }

        html[data-terminal-mode="raw"] .header-btn:disabled {
            background: #d7d1cf;
        }

        #touch-select-btn,
        #paste-btn {
            display: none;
        }

        #mobile-scroll-controls {
            position: absolute;
            right: 10px;
            bottom: calc(var(--keyboard-inset, 0px) + 10px + env(safe-area-inset-bottom, 0px));
            z-index: 1200;
            display: none !important;
            flex-direction: column;
            gap: 6px;
        }

        .scroll-btn {
            width: 38px;
            height: 38px;
            border: 1px solid rgba(121, 199, 197, 0.32);
            border-radius: 999px;
            background: rgba(23, 27, 29, 0.88);
            color: var(--text);
            box-shadow: 0 8px 24px var(--shadow);
            font-size: 16px;
            font-weight: 700;
        }

        .scroll-btn:active {
            background: rgba(240, 180, 91, 0.22);
            border-color: rgba(240, 180, 91, 0.65);
            color: var(--accent-strong);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        #status {
            font-size: 12px;
            color: var(--muted);
            padding: 0 12px;
            transition: all 0.2s ease;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: min(44vw, 520px);
        }

        #status.success {
            color: var(--success);
        }

        #status.error {
            color: var(--danger);
        }

        #status:hover {
            opacity: 0.8;
        }

        #status[style*="cursor: pointer"] {
            user-select: all;
        }

        #terminal-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            min-height: 0;
            background: #050708;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }

        html[data-terminal-mode="raw"] #terminal-container {
            background:
                linear-gradient(rgba(17, 24, 39, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(17, 24, 39, 0.025) 1px, transparent 1px),
                #fff8eb;
            background-size: 100% 22px, 22px 100%, auto;
            border-top-color: rgba(52, 64, 68, 0.18);
        }

        #terminal-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #050708;
        }

        html[data-terminal-mode="raw"] #terminal-frame {
            background: #fff8eb;
            filter: invert(1) hue-rotate(180deg) saturate(1.35) contrast(1.12) brightness(1.12);
        }

        #mobile-input-bar {
            display: none;
            flex-direction: column;
            gap: 7px;
            flex-shrink: 0;
            padding: 8px 9px calc(8px + env(safe-area-inset-bottom, 0px));
            border-top: 1px solid rgba(121, 199, 197, 0.2);
            background: rgba(23, 27, 29, 0.98);
            box-shadow: 0 -10px 28px rgba(0, 0, 0, 0.28);
        }

        html[data-terminal-mode="raw"] #mobile-input-bar {
            background: rgba(246, 238, 228, 0.98);
            border-top-color: rgba(52, 64, 68, 0.18);
            box-shadow: 0 -10px 28px rgba(52, 64, 68, 0.12);
        }

        #mobile-key-strip {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            overscroll-behavior-x: contain;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        #mobile-key-strip::-webkit-scrollbar {
            display: none;
        }

        .mobile-key-btn,
        #mobile-send-btn {
            flex: 0 0 auto;
            min-width: 42px;
            height: 34px;
            border: 1px solid rgba(121, 199, 197, 0.28);
            border-radius: 6px;
            background: var(--button);
            color: var(--text);
            font: 650 12px/1 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        html[data-terminal-mode="raw"] .mobile-key-btn,
        html[data-terminal-mode="raw"] #mobile-send-btn {
            border-color: rgba(159, 47, 99, 0.22);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55);
        }

        .mobile-key-btn:active,
        #mobile-send-btn:active {
            background: rgba(240, 180, 91, 0.22);
            border-color: rgba(240, 180, 91, 0.65);
            color: var(--accent-strong);
        }

        #mobile-input-row {
            display: flex;
            align-items: flex-end;
            gap: 7px;
        }

        #mobile-terminal-input {
            flex: 1 1 auto;
            width: 100%;
            min-height: 40px;
            max-height: 120px;
            resize: none;
            overflow-y: auto;
            border: 1px solid rgba(121, 199, 197, 0.28);
            border-radius: 6px;
            background: #0d1112;
            color: var(--text);
            padding: 10px;
            font: 14px/1.35 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            outline: none;
        }

        html[data-terminal-mode="raw"] #mobile-terminal-input {
            background: #fffdf7;
            border-color: rgba(52, 64, 68, 0.22);
            box-shadow: inset 0 1px 2px rgba(52, 64, 68, 0.08);
        }

        #mobile-terminal-input:focus {
            border-color: rgba(240, 180, 91, 0.65);
            box-shadow: 0 0 0 2px rgba(240, 180, 91, 0.12);
        }

        html[data-terminal-mode="raw"] #mobile-terminal-input:focus {
            border-color: rgba(15, 75, 164, 0.45);
            box-shadow: 0 0 0 2px rgba(15, 75, 164, 0.1);
        }

        #mobile-send-btn {
            min-width: 58px;
            height: 40px;
            font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #drop-zone {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 14, 15, 0.88);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            pointer-events: none;
        }

        #drop-zone.active {
            display: flex;
            pointer-events: auto;
        }

        #drop-zone-text {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            text-align: center;
            padding: 18px 24px;
            border: 1px solid rgba(240, 180, 91, 0.55);
            border-radius: 8px;
            background: rgba(23, 27, 29, 0.94);
            box-shadow: 0 18px 45px var(--shadow);
        }

        #manual-copy-panel,
        #manual-paste-panel,
        #shell-output-panel {
            position: fixed;
            left: 16px;
            right: 16px;
            bottom: calc(var(--keyboard-inset, 0px) + 16px + env(safe-area-inset-bottom, 0px));
            z-index: 2500;
            display: none;
            gap: 10px;
            flex-direction: column;
            padding: 12px;
            border: 1px solid rgba(121, 199, 197, 0.45);
            border-radius: 8px;
            background: rgba(23, 27, 29, 0.98);
            box-shadow: 0 18px 45px var(--shadow);
            max-height: calc(var(--app-height, 100vh) - 32px);
            overflow: auto;
        }

        #manual-copy-panel.active,
        #manual-paste-panel.active,
        #shell-output-panel.active {
            display: flex;
        }

        #change-desk-panel {
            position: fixed;
            top: 64px;
            right: 16px;
            bottom: calc(var(--keyboard-inset, 0px) + 16px + env(safe-area-inset-bottom, 0px));
            z-index: 2600;
            display: none;
            flex-direction: column;
            width: min(760px, calc(100vw - 32px));
            border: 1px solid rgba(121, 199, 197, 0.45);
            border-radius: 8px;
            background: rgba(23, 27, 29, 0.98);
            box-shadow: 0 24px 60px var(--shadow);
            overflow: hidden;
        }

        #change-desk-panel.active {
            display: flex;
        }

        #change-desk-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px;
            border-bottom: 1px solid var(--border-soft);
        }

        #change-desk-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
        }

        #change-desk-generated {
            color: var(--muted);
            font-size: 12px;
        }

        #change-desk-body {
            flex: 1 1 auto;
            overflow: auto;
            padding: 12px;
        }

        #change-desk-summary {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 8px;
            margin-bottom: 12px;
        }

        .change-desk-metric,
        .change-desk-section {
            border: 1px solid var(--border-soft);
            border-radius: 8px;
            background: #0d1112;
        }

        .change-desk-metric {
            min-width: 0;
            padding: 9px;
        }

        .change-desk-metric-label {
            color: var(--muted);
            font-size: 11px;
            font-weight: 650;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .change-desk-metric-value {
            color: var(--text);
            font-size: 13px;
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        .change-desk-metric-value.ok {
            color: var(--success);
        }

        .change-desk-metric-value.warn {
            color: var(--accent-strong);
        }

        .change-desk-metric-value.fail {
            color: var(--danger);
        }

        .change-desk-section {
            margin-top: 10px;
            overflow: hidden;
        }

        .change-desk-section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 9px 10px;
            border-bottom: 1px solid var(--border-soft);
            color: var(--text);
            font-size: 13px;
            font-weight: 700;
        }

        .change-desk-badge {
            border: 1px solid var(--border-soft);
            border-radius: 999px;
            padding: 2px 7px;
            color: var(--muted);
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }

        .change-desk-badge.ok {
            border-color: rgba(142, 192, 124, 0.45);
            color: var(--success);
        }

        .change-desk-badge.warn {
            border-color: rgba(240, 180, 91, 0.55);
            color: var(--accent-strong);
        }

        .change-desk-badge.fail {
            border-color: rgba(251, 111, 95, 0.5);
            color: var(--danger);
        }

        .change-desk-section-body {
            padding: 10px;
            color: var(--text);
            font-size: 12px;
            line-height: 1.45;
        }

        .change-desk-output {
            margin: 8px 0 0;
            max-height: 170px;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-word;
            color: var(--text);
            border: 1px solid var(--border-soft);
            border-radius: 6px;
            background: #090c0d;
            padding: 9px;
            font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        .change-desk-list {
            display: grid;
            gap: 5px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .change-desk-list li {
            min-width: 0;
            overflow-wrap: anywhere;
            color: var(--text);
        }

        .change-desk-muted {
            color: var(--muted);
        }

        #change-desk-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            padding: 12px;
            border-top: 1px solid var(--border-soft);
        }

        #manual-copy-message,
        #manual-paste-message,
        #shell-output-message {
            color: var(--text);
            font-size: 13px;
            line-height: 1.4;
        }

        #manual-copy-text,
        #manual-paste-text {
            width: 100%;
            min-height: 72px;
            resize: vertical;
            border: 1px solid var(--border-soft);
            border-radius: 6px;
            background: #0d1112;
            color: var(--text);
            padding: 10px;
            font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            max-height: min(220px, calc(var(--app-height, 100vh) - 180px));
        }

        #shell-output-text {
            margin: 0;
            width: 100%;
            min-height: 72px;
            max-height: min(320px, calc(var(--app-height, 100vh) - 180px));
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-word;
            border: 1px solid var(--border-soft);
            border-radius: 6px;
            background: #0d1112;
            color: var(--text);
            padding: 10px;
            font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .modal-buttons {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .modal-btn {
            padding: 8px 16px;
            border: 1px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 650;
        }

        .modal-btn-primary {
            background: var(--button);
            border-color: rgba(121, 199, 197, 0.35);
            color: var(--text);
        }

        .modal-btn-primary:hover {
            background: var(--button-hover);
        }

        .modal-btn-danger {
            background: #51312f;
            border-color: rgba(251, 111, 95, 0.5);
            color: #fff0e8;
        }

        .modal-btn-danger:hover {
            background: #633632;
        }

        .modal-btn-secondary {
            background: var(--panel-strong);
            border-color: var(--border-soft);
            color: var(--text);
        }

        .modal-btn-secondary:hover {
            background: #2c3336;
        }

        @media (max-width: 760px) {
            #header {
                align-items: flex-start;
                flex-direction: column;
                gap: 6px;
                padding: 7px 10px;
            }

            #header-actions {
                width: 100%;
                justify-content: flex-start;
                flex-wrap: wrap;
                gap: 6px;
            }

            #terminal-mode-switch {
                flex: 1 0 100%;
                width: 100%;
            }

            .terminal-mode-btn {
                flex: 1 1 0;
            }

            #status {
                flex: 1 0 100%;
                order: 2;
                max-width: none;
                padding-left: 0;
            }

            .header-btn {
                flex: 1 1 calc(50% - 8px);
                justify-content: center;
                padding: 6px 8px;
            }

            #change-desk-panel {
                top: 8px;
                right: 8px;
                bottom: calc(var(--keyboard-inset, 0px) + 8px + env(safe-area-inset-bottom, 0px));
                width: calc(100vw - 16px);
            }

            #change-desk-summary {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            #touch-select-btn,
            #paste-btn {
                display: flex;
            }

            #mobile-input-bar {
                display: flex;
            }

            .status-pill {
                display: none;
            }
        }

        html.touch-ui #touch-select-btn,
        html.touch-ui #paste-btn {
            display: flex;
        }

        html.touch-ui #header {
            align-items: flex-start;
            flex-direction: column;
            gap: 6px;
            padding: 7px 10px;
        }

        html.touch-ui #header-actions {
            width: 100%;
            justify-content: flex-start;
            flex-wrap: wrap;
            gap: 6px;
        }

        html.touch-ui #terminal-mode-switch {
            flex: 1 0 100%;
            width: 100%;
        }

        html.touch-ui .terminal-mode-btn {
            flex: 1 1 0;
        }

        html.touch-ui #status {
            flex: 1 0 100%;
            order: 2;
            max-width: none;
            padding-left: 0;
        }

        html.touch-ui .header-btn {
            flex: 1 1 calc(50% - 8px);
            justify-content: center;
            padding: 6px 8px;
        }

        html.touch-ui #mobile-input-bar {
            display: flex;
        }

        @media (pointer: coarse) {
            #touch-select-btn,
            #paste-btn {
                display: flex;
            }

            #mobile-input-bar {
                display: flex;
            }
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="header">
            <div id="header-title">
                <span class="brand-mark">&gt;_</span>
                <span>Codex Terminal Pro</span>
                <span class="status-pill">/config</span>
            </div>
            <div id="header-actions">
                <div id="terminal-mode-switch" role="group" aria-label="Terminal mode">
                    <button type="button" class="terminal-mode-btn active" data-terminal-mode="codex" aria-pressed="true">Codex</button>
                    <button type="button" class="terminal-mode-btn" data-terminal-mode="raw" aria-pressed="false">Shell</button>
                </div>
                <span id="status"></span>
                <button id="change-desk-btn" class="header-btn" title="Review Home Assistant changes and validation status">
                    <span>▤</span>
                    <span>Change Desk</span>
                </button>
                <button id="touch-select-btn" class="header-btn" title="Touch-drag terminal text to copy">
                    <span>▣</span>
                    <span>Select Text</span>
                </button>
                <button id="paste-btn" class="header-btn" title="Paste text or an image from the clipboard into the terminal">
                    <span>📋</span>
                    <span>Paste</span>
                </button>
            </div>
        </div>
        <div id="terminal-container">
            <iframe id="terminal-frame" src="about:blank"></iframe>
            <div id="drop-zone">
                <div id="drop-zone-text">Drop image to upload into Codex</div>
            </div>
            <div id="mobile-scroll-controls" aria-label="Terminal scroll controls">
                <button class="scroll-btn" data-terminal-action="scroll-up" title="Scroll terminal back" aria-label="Scroll terminal back">↑</button>
                <button class="scroll-btn" data-terminal-action="scroll-down" title="Scroll terminal forward" aria-label="Scroll terminal forward">↓</button>
                <button class="scroll-btn" data-terminal-action="scroll-bottom" title="Return to live prompt" aria-label="Return to live prompt">⌄</button>
            </div>
        </div>
        <div id="mobile-input-bar" aria-label="Mobile terminal input">
            <div id="mobile-key-strip" aria-label="Terminal shortcut keys">
                <button type="button" class="mobile-key-btn" data-terminal-action="ctrl-c" title="Send Ctrl-C">^C</button>
                <button type="button" class="mobile-key-btn" data-terminal-action="ctrl-d" title="Send Ctrl-D">^D</button>
                <button type="button" class="mobile-key-btn" data-terminal-action="ctrl-z" title="Send Ctrl-Z">^Z</button>
                <button type="button" class="mobile-key-btn" data-terminal-action="tab" title="Send Tab">Tab</button>
                <button type="button" class="mobile-key-btn" data-terminal-action="enter" title="Send Enter">Enter</button>
                <button type="button" class="mobile-key-btn" data-terminal-action="up" title="Previous command">↑</button>
                <button type="button" class="mobile-key-btn" data-terminal-action="down" title="Next command">↓</button>
                <button type="button" class="mobile-key-btn" data-terminal-action="ctrl-l" title="Clear terminal">Clr</button>
                <button type="button" class="mobile-key-btn" data-terminal-action="scroll-up" title="Page up through terminal output">PgUp</button>
                <button type="button" class="mobile-key-btn" data-terminal-action="scroll-down" title="Page down through terminal output">PgDn</button>
                <button type="button" class="mobile-key-btn" data-terminal-action="scroll-bottom" title="Return to the live prompt">Bottom</button>
            </div>
            <form id="mobile-input-row">
                <textarea id="mobile-terminal-input" rows="1" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="send" placeholder="Type command"></textarea>
                <button type="submit" id="mobile-send-btn">Send</button>
            </form>
        </div>
    </div>
    <div id="manual-copy-panel" aria-live="polite">
        <div id="manual-copy-message">Copy this text manually.</div>
        <textarea id="manual-copy-text" readonly></textarea>
        <div class="modal-buttons">
            <button id="manual-copy-dismiss" class="modal-btn modal-btn-secondary">Dismiss</button>
        </div>
    </div>

    <div id="manual-paste-panel" aria-live="polite">
        <div id="manual-paste-message">Paste text below, then insert it into the terminal.</div>
        <textarea id="manual-paste-text" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
        <div class="modal-buttons">
            <button id="manual-paste-insert" class="modal-btn modal-btn-primary">Insert</button>
            <button id="manual-paste-dismiss" class="modal-btn modal-btn-secondary">Dismiss</button>
        </div>
    </div>

    <div id="shell-output-panel" aria-live="polite">
        <div id="shell-output-message">Shell command completed.</div>
        <pre id="shell-output-text"></pre>
        <div class="modal-buttons">
            <button id="shell-output-copy" class="modal-btn modal-btn-primary">Copy Output</button>
            <button id="shell-output-dismiss" class="modal-btn modal-btn-secondary">Dismiss</button>
        </div>
    </div>

    <div id="change-desk-panel" aria-live="polite" aria-label="Change Desk">
        <div id="change-desk-header">
            <div>
                <div id="change-desk-title">Change Desk</div>
                <div id="change-desk-generated"></div>
            </div>
            <button id="change-desk-close" class="modal-btn modal-btn-secondary">Close</button>
        </div>
        <div id="change-desk-body">
            <div id="change-desk-summary"></div>
            <div id="change-desk-content"></div>
        </div>
        <div id="change-desk-footer">
            <button id="change-desk-copy" class="modal-btn modal-btn-secondary">Copy Summary</button>
            <button id="change-desk-prompt" class="modal-btn modal-btn-secondary">Send Report</button>
            <button id="change-desk-refresh" class="modal-btn modal-btn-primary">Refresh</button>
        </div>
    </div>

    <script>
        let ttydPort = 7681;
        let uploadDir = '/data/images';
        let terminalMode = 'codex';
        let lastCopiedTerminalSelection = '';
        let lastCopiedTerminalSelectionAt = 0;
        let lastImagePasteSignature = '';
        let lastImagePasteAt = 0;
        let touchSelectionMode = false;
        const handledImagePasteEvents = new WeakSet();
        const rootElement = document.documentElement;
        let viewportSyncTimer = null;
        let keyboardWasOpen = false;
        let statusTimer = null;

        function isTouchUi() {
            return Boolean(
                navigator.maxTouchPoints > 0 ||
                window.matchMedia('(pointer: coarse)').matches ||
                window.matchMedia('(max-width: 760px)').matches
            );
        }

        function updateTouchUiClass() {
            rootElement.classList.toggle('touch-ui', isTouchUi());
        }

        function updateViewportMetrics() {
            const visualViewport = window.visualViewport;
            const viewportHeight = Math.max(
                320,
                Math.round(visualViewport?.height || window.innerHeight || document.documentElement.clientHeight || 0)
            );
            const viewportOffsetTop = Math.round(visualViewport?.offsetTop || 0);
            const layoutHeight = window.innerHeight || document.documentElement.clientHeight || viewportHeight;
            const keyboardInset = Math.max(0, Math.round(layoutHeight - viewportHeight - viewportOffsetTop));
            const keyboardOpen = keyboardInset > 80;

            rootElement.style.setProperty('--app-height', `${viewportHeight}px`);
            rootElement.style.setProperty('--keyboard-inset', `${keyboardInset}px`);
            rootElement.classList.toggle('keyboard-open', keyboardOpen);

            scheduleTerminalViewportSync(keyboardOpen);
            if (keyboardOpen && !keyboardWasOpen) {
                sendTerminalControl('scroll-bottom').catch((err) => {
                    console.log('Could not return terminal to prompt after keyboard opened:', err);
                });
            }
            keyboardWasOpen = keyboardOpen;
        }

        function scheduleTerminalViewportSync(scrollToBottom = false) {
            if (viewportSyncTimer) {
                clearTimeout(viewportSyncTimer);
            }

            viewportSyncTimer = setTimeout(() => {
                syncTerminalViewport(scrollToBottom);
            }, 80);
        }

        function syncTerminalViewport(scrollToBottom = false) {
            const iframe = document.getElementById('terminal-frame');
            let iframeWindow;

            try {
                iframeWindow = iframe?.contentWindow;
            } catch {
                return;
            }

            if (!iframeWindow) {
                return;
            }

            try {
                iframeWindow.dispatchEvent(new Event('resize'));
                if (scrollToBottom && iframeWindow.term && typeof iframeWindow.term.scrollToBottom === 'function') {
                    iframeWindow.term.scrollToBottom();
                }
            } catch (err) {
                console.log('Could not sync terminal viewport:', err);
            }
        }

        function focusTerminal(scrollToBottom = false) {
            const iframe = document.getElementById('terminal-frame');
            let iframeWindow;

            try {
                iframeWindow = iframe?.contentWindow;
            } catch {
                return;
            }

            if (!iframeWindow) {
                return;
            }

            try {
                iframeWindow.focus();
                if (iframeWindow.term && typeof iframeWindow.term.focus === 'function') {
                    iframeWindow.term.focus();
                }
                if (scrollToBottom && iframeWindow.term && typeof iframeWindow.term.scrollToBottom === 'function') {
                    iframeWindow.term.scrollToBottom();
                }
            } catch (err) {
                console.log('Could not focus terminal:', err);
            }
        }

        updateTouchUiClass();
        updateViewportMetrics();
        window.addEventListener('resize', () => {
            updateTouchUiClass();
            updateViewportMetrics();
        });
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                updateTouchUiClass();
                updateViewportMetrics();
            }, 250);
        });
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', updateViewportMetrics);
            window.visualViewport.addEventListener('scroll', updateViewportMetrics);
        }

        function ingressPath(path) {
            const cleanPath = String(path).replace(/^\/+/, '');
            const basePath = window.location.pathname.replace(/\/+$/, '');

            if (!basePath) {
                return `/${cleanPath}`;
            }

            return `${basePath}/${cleanPath}`;
        }

        // Fetch configuration and load ttyd
        // Use relative paths for Home Assistant ingress compatibility
        fetch(ingressPath('config'))
            .then(res => res.json())
            .then(config => {
                ttydPort = config.ttydPort;
                uploadDir = config.uploadDir;
                setTerminalModeState(config.terminalMode || 'codex', false);
                console.log('Config loaded:', config);
                // Load ttyd via proxy endpoint
                loadTerminal();
            })
            .catch(err => {
                console.error('Failed to load config:', err);
                // Fallback: load terminal anyway
                loadTerminal();
            });

        function loadTerminal() {
            const iframe = document.getElementById('terminal-frame');
            // Use an ingress-aware absolute path to avoid //terminal/ when Home
            // Assistant serves the add-on from a double-slash ingress base URL.
            iframe.addEventListener('load', () => {
                scheduleTerminalViewportSync(false);
            });
            iframe.src = ingressPath('terminal/?embedded=1');
            installTerminalSelectionCopy();
        }

        const status = document.getElementById('status');
        const terminalModeButtons = Array.from(document.querySelectorAll('[data-terminal-mode]'));
        const changeDeskBtn = document.getElementById('change-desk-btn');
        const changeDeskPanel = document.getElementById('change-desk-panel');
        const changeDeskGenerated = document.getElementById('change-desk-generated');
        const changeDeskSummary = document.getElementById('change-desk-summary');
        const changeDeskContent = document.getElementById('change-desk-content');
        const changeDeskRefresh = document.getElementById('change-desk-refresh');
        const changeDeskCopy = document.getElementById('change-desk-copy');
        const changeDeskPrompt = document.getElementById('change-desk-prompt');
        const changeDeskClose = document.getElementById('change-desk-close');
        const touchSelectBtn = document.getElementById('touch-select-btn');
        const pasteBtn = document.getElementById('paste-btn');
        const dropZone = document.getElementById('drop-zone');
        const manualCopyPanel = document.getElementById('manual-copy-panel');
        const manualCopyText = document.getElementById('manual-copy-text');
        const manualCopyMessage = document.getElementById('manual-copy-message');
        const manualCopyDismiss = document.getElementById('manual-copy-dismiss');
        const manualPastePanel = document.getElementById('manual-paste-panel');
        const manualPasteText = document.getElementById('manual-paste-text');
        const manualPasteInsert = document.getElementById('manual-paste-insert');
        const manualPasteDismiss = document.getElementById('manual-paste-dismiss');
        const shellOutputPanel = document.getElementById('shell-output-panel');
        const shellOutputMessage = document.getElementById('shell-output-message');
        const shellOutputText = document.getElementById('shell-output-text');
        const shellOutputCopy = document.getElementById('shell-output-copy');
        const shellOutputDismiss = document.getElementById('shell-output-dismiss');
        const mobileInputRow = document.getElementById('mobile-input-row');
        const mobileTerminalInput = document.getElementById('mobile-terminal-input');
        const mobileSendBtn = document.getElementById('mobile-send-btn');
        const SHELL_DISPATCH_PREFIX = ',,';
        let terminalLineBuffer = '';
        let latestShellOutput = '';
        let latestChangeDeskSummary = '';
        let lastPrintableKey = null;
        let lastPasteText = null;
        let terminalTextSource = null;
        let lastTerminalEventSignature = null;
        let shellDispatchBlockInputUntil = 0;
        const trackedTerminalEvents = new WeakSet();

        function setStatus(message, type = '', persistent = false) {
            if (statusTimer) {
                clearTimeout(statusTimer);
                statusTimer = null;
            }

            status.textContent = message;
            status.className = type;
            if (message && !persistent) {
                statusTimer = setTimeout(() => setStatus(''), 5000);
            }
        }

        function changeDeskElement(tag, className = '', text = '') {
            const element = document.createElement(tag);
            if (className) {
                element.className = className;
            }
            if (text !== '') {
                element.textContent = text;
            }
            return element;
        }

        function changeDeskBadgeKind(status) {
            if (['passed', 'clean', 'available', 'loaded', 'ok'].includes(status)) {
                return 'ok';
            }
            if (['failed', 'error'].includes(status)) {
                return 'fail';
            }
            return 'warn';
        }

        function changeDeskBadge(status, label = status) {
            const badge = changeDeskElement('span', `change-desk-badge ${changeDeskBadgeKind(status)}`, label || 'unknown');
            return badge;
        }

        function changeDeskMetric(label, value, status = '') {
            const metric = changeDeskElement('div', 'change-desk-metric');
            metric.appendChild(changeDeskElement('div', 'change-desk-metric-label', label));
            const valueElement = changeDeskElement('div', 'change-desk-metric-value', value || 'unknown');
            if (status) {
                valueElement.classList.add(changeDeskBadgeKind(status));
            }
            metric.appendChild(valueElement);
            return metric;
        }

        function changeDeskSection(title, status, label = status) {
            const section = changeDeskElement('section', 'change-desk-section');
            const header = changeDeskElement('div', 'change-desk-section-title');
            header.appendChild(changeDeskElement('span', '', title));
            header.appendChild(changeDeskBadge(status, label));
            const body = changeDeskElement('div', 'change-desk-section-body');
            section.appendChild(header);
            section.appendChild(body);
            return { section, body };
        }

        function appendChangeDeskLine(parent, label, value) {
            const row = changeDeskElement('div', 'change-desk-muted');
            row.textContent = `${label}: `;
            const strong = changeDeskElement('strong', '', value || 'unknown');
            strong.style.color = 'var(--text)';
            row.appendChild(strong);
            parent.appendChild(row);
        }

        function appendChangeDeskList(parent, items, emptyText = 'None') {
            if (!items || items.length === 0) {
                parent.appendChild(changeDeskElement('div', 'change-desk-muted', emptyText));
                return;
            }

            const list = changeDeskElement('ul', 'change-desk-list');
            items.forEach((item) => {
                list.appendChild(changeDeskElement('li', '', String(item)));
            });
            parent.appendChild(list);
        }

        function appendChangeDeskOutput(parent, output) {
            if (!output) {
                return;
            }
            parent.appendChild(changeDeskElement('pre', 'change-desk-output', output));
        }

        function formatChangeDeskAge(seconds) {
            if (!Number.isFinite(seconds)) {
                return 'unknown';
            }
            if (seconds < 60) {
                return `${seconds}s ago`;
            }
            const minutes = Math.round(seconds / 60);
            if (minutes < 60) {
                return `${minutes}m ago`;
            }
            const hours = Math.round(minutes / 60);
            return `${hours}h ago`;
        }

        function setChangeDeskLoading() {
            changeDeskGenerated.textContent = 'Collecting snapshot...';
            changeDeskSummary.replaceChildren(
                changeDeskMetric('YAML audit', 'loading'),
                changeDeskMetric('Core check', 'loading'),
                changeDeskMetric('Monitor', 'loading'),
                changeDeskMetric('Logs', 'loading'),
                changeDeskMetric('Live API', 'loading')
            );
            changeDeskContent.replaceChildren(changeDeskElement('div', 'change-desk-muted', 'Running read-only checks...'));
        }

        function renderChangeDeskAudit(parent, audit) {
            const { section, body } = changeDeskSection('Home Assistant YAML Audit', audit?.status || 'unavailable');

            if (!audit?.available) {
                body.appendChild(changeDeskElement('div', 'change-desk-muted', audit?.message || audit?.output || 'Audit unavailable.'));
                parent.appendChild(section);
                return;
            }

            appendChangeDeskLine(body, 'Config', audit.config || '');
            appendChangeDeskLine(body, 'YAML', `${audit.yaml?.ok || 0}/${audit.yaml?.checked || 0} ok`);
            appendChangeDeskLine(body, 'Storage files', String(audit.counts?.storage_files ?? 'unknown'));
            appendChangeDeskLine(body, 'Custom components', String(audit.counts?.custom_components ?? audit.customComponents?.length ?? 'unknown'));

            if (audit.yaml?.errorCount) {
                const errors = audit.yaml.errors.map((item) => `${item.path}: ${item.error}`);
                appendChangeDeskList(body, errors, 'No YAML errors.');
            }
            parent.appendChild(section);
        }

        function renderChangeDeskCoreCheck(parent, coreCheck) {
            const { section, body } = changeDeskSection('Core Check', coreCheck?.status || 'unavailable');

            if (!coreCheck?.available) {
                body.appendChild(changeDeskElement('div', 'change-desk-muted', coreCheck?.message || 'Core check unavailable.'));
                parent.appendChild(section);
                return;
            }

            appendChangeDeskLine(body, 'Command', coreCheck.command || 'ha core check');
            appendChangeDeskLine(body, 'Exit', Number.isInteger(coreCheck.exitCode) ? String(coreCheck.exitCode) : 'unknown');
            if (coreCheck.timedOut) {
                body.appendChild(changeDeskElement('div', 'change-desk-muted', 'Timed out before completion.'));
            }
            appendChangeDeskOutput(body, coreCheck.output || '(no output)');
            parent.appendChild(section);
        }

        function renderChangeDeskLogs(parent, logs) {
            const { section, body } = changeDeskSection('Recent Logs', logs?.status || 'unavailable');

            if (!logs?.available) {
                body.appendChild(changeDeskElement('div', 'change-desk-muted', logs?.message || logs?.output || 'Home Assistant logs unavailable.'));
                parent.appendChild(section);
                return;
            }

            appendChangeDeskLine(body, 'Command', logs.command || 'ha core logs');
            appendChangeDeskLine(body, 'Scanned lines', String(logs.scannedLines ?? 'unknown'));
            appendChangeDeskLine(body, 'Errors', String((logs.counts?.critical || 0) + (logs.counts?.error || 0)));
            appendChangeDeskLine(body, 'Warnings', String(logs.counts?.warning || 0));

            if (logs.repeated?.length) {
                body.appendChild(changeDeskElement('div', 'change-desk-muted', 'Repeated:'));
                appendChangeDeskList(
                    body,
                    logs.repeated.map((item) => `${item.count}x ${formatChangeDeskIssue(item)}`),
                    'No repeated issues.'
                );
            }

            if (logs.issues?.length) {
                body.appendChild(changeDeskElement('div', 'change-desk-muted', 'Apparent issues:'));
                appendChangeDeskList(
                    body,
                    logs.issues.slice(0, 6).map(formatChangeDeskIssue),
                    'No apparent issues.'
                );
            } else {
                body.appendChild(changeDeskElement('div', 'change-desk-muted', 'No recent warnings or errors found.'));
            }

            parent.appendChild(section);
        }

        function renderChangeDeskMonitor(parent, monitor) {
            const { section, body } = changeDeskSection('HA Monitor', monitor?.status || 'unavailable');

            if (!monitor?.available) {
                body.appendChild(changeDeskElement('div', 'change-desk-muted', monitor?.message || 'HA monitor state unavailable.'));
                parent.appendChild(section);
                return;
            }

            appendChangeDeskLine(body, 'Mode', monitor.mode || 'observer');
            appendChangeDeskLine(body, 'Last run', `${monitor.generatedAt || 'unknown'} (${formatChangeDeskAge(monitor.ageSeconds)})`);
            appendChangeDeskLine(body, 'Persistent/current', `${monitor.persistentIssues?.length || 0}/${monitor.currentIssues?.length || 0}`);
            appendChangeDeskLine(body, 'Interval', monitor.intervalSeconds ? `${monitor.intervalSeconds}s` : 'unknown');
            if (monitor.triage?.dominantPosture) {
                appendChangeDeskLine(
                    body,
                    'Triage',
                    `${monitor.triage.dominantPosture} (${monitor.triage.localizedNoiseCount || 0} local noise, ${monitor.triage.configBlockerCount || 0} config blockers)`
                );
                if (monitor.triage.summaryLines?.length) {
                    appendChangeDeskList(body, monitor.triage.summaryLines.slice(0, 3), 'No triage summary.');
                }
            }

            const dispatch = monitor.dispatch || {};
            const gate = dispatch.reasoningGate || {};
            if (dispatch.available) {
                const dispatchLabel = dispatch.meaningfulDelta ? 'meaningful delta' : 'quiet';
                appendChangeDeskLine(body, 'Dispatch', `${dispatch.status || 'unknown'} (${dispatchLabel})`);
                appendChangeDeskLine(
                    body,
                    'Budget gate',
                    `auto LLM ${gate.automaticLlmCalls ? 'enabled' : 'off'}, low ${gate.lowReasoningEligible ? 'eligible' : 'deferred'}, cooldown ${gate.cooldownRemainingSeconds || 0}s, high on demand`
                );
                const deltaLines = dispatch.delta?.summaryLines || [];
                if (deltaLines.length) {
                    body.appendChild(changeDeskElement('div', 'change-desk-muted', 'Dispatch packet:'));
                    appendChangeDeskList(body, deltaLines.slice(0, 6), 'No monitor delta.');
                }
            }

            if (monitor.persistentIssues?.length) {
                body.appendChild(changeDeskElement('div', 'change-desk-muted', 'Persistent issues:'));
                appendChangeDeskList(
                    body,
                    monitor.persistentIssues.map((item) => `${item.runsSeen || 0} runs ${formatChangeDeskIssue(item)}`),
                    'No persistent issues.'
                );
            }

            if (monitor.currentIssues?.length) {
                body.appendChild(changeDeskElement('div', 'change-desk-muted', 'Current issues:'));
                appendChangeDeskList(
                    body,
                    monitor.currentIssues.slice(0, 6).map(formatChangeDeskIssue),
                    'No current issues.'
                );
            } else {
                body.appendChild(changeDeskElement('div', 'change-desk-muted', 'No current monitor issues.'));
            }

            const unavailable = monitor.states?.unavailableSamples || [];
            const unknown = monitor.states?.unknownSamples || [];
            if (unavailable.length || unknown.length) {
                const samples = unavailable.concat(unknown).slice(0, 6).map((item) => {
                    const friendly = item.friendly_name ? ` (${item.friendly_name})` : '';
                    return `${item.entity_id}: ${item.state}${friendly}`;
                });
                body.appendChild(changeDeskElement('div', 'change-desk-muted', 'State samples:'));
                appendChangeDeskList(body, samples, 'No unavailable or unknown samples.');
            }

            const taskDir = monitor.taskSlots?.directory;
            if (taskDir) {
                body.appendChild(changeDeskElement('div', 'change-desk-muted', `Task slots reserved at ${taskDir}; execution disabled.`));
            }

            parent.appendChild(section);
        }

        function formatChangeDeskIssue(item) {
            const label = item?.classification?.label ? ` [${item.classification.label}]` : '';
            return `${item?.severity || 'warning'}${label}: ${item?.sample || ''}`;
        }

        function renderChangeDeskLive(parent, live, mcp) {
            const liveStatus = live?.available ? 'available' : 'unavailable';
            const { section, body } = changeDeskSection('Live Home Assistant', liveStatus);

            if (live?.available) {
                appendChangeDeskLine(body, 'Location', live.config?.locationName || '');
                appendChangeDeskLine(body, 'Version', live.config?.version || '');
                appendChangeDeskLine(body, 'Time zone', live.config?.timeZone || '');
                appendChangeDeskLine(body, 'Components', live.config?.components === null ? 'unknown' : String(live.config?.components));
            } else {
                body.appendChild(changeDeskElement('div', 'change-desk-muted', live?.message || live?.output || 'Live API unavailable.'));
            }

            const mcpText = mcp?.available
                ? (mcp.componentLoaded ? `MCP loaded at ${mcp.externalPath || '/api/mcp'}` : 'MCP integration not loaded')
                : (mcp?.message || 'MCP status unavailable');
            body.appendChild(changeDeskElement('div', 'change-desk-muted', mcpText));
            parent.appendChild(section);
        }

        function renderChangeDeskRecommendations(parent, recommendations = []) {
            const { section, body } = changeDeskSection('Recommendations', recommendations.length ? 'warn' : 'ok', `${recommendations.length}`);
            appendChangeDeskList(body, recommendations, 'No recommendations.');
            parent.appendChild(section);
        }

        function changeDeskPlainText(data) {
            const lines = [
                `Change Desk snapshot: ${data.generatedAt || 'unknown'}`,
                `Workspace: ${data.workspace || '/config'}`,
                `Duration: ${data.durationMs || 0}ms`
            ];

            lines.push(
                '',
                `YAML audit: ${data.audit?.status || 'unavailable'} (${data.audit?.yaml?.ok || 0}/${data.audit?.yaml?.checked || 0} ok)`,
                `Core check: ${data.coreCheck?.status || 'unavailable'}`,
                `Monitor: ${data.monitor?.status || 'unavailable'} (${data.monitor?.persistentIssues?.length || 0} persistent, ${data.monitor?.currentIssues?.length || 0} current)`,
                `Dispatch: ${data.monitor?.dispatch?.status || 'unavailable'} (meaningful_delta=${Boolean(data.monitor?.dispatch?.meaningfulDelta)})`,
                `Logs: ${data.logs?.status || 'unavailable'} (${(data.logs?.counts?.critical || 0) + (data.logs?.counts?.error || 0)} errors, ${data.logs?.counts?.warning || 0} warnings)`,
                `Live API: ${data.live?.status || 'unavailable'}`,
                `MCP: ${data.mcp?.status || 'unavailable'}`
            );

            if (data.monitor?.dispatch?.delta?.summaryLines?.length) {
                lines.push('', 'Prepared dispatch packet:');
                data.monitor.dispatch.delta.summaryLines.forEach((item) => lines.push(`  - ${item}`));
            }

            if (data.monitor?.triage?.summaryLines?.length) {
                lines.push('', `Monitor triage: ${data.monitor.triage.dominantPosture || 'unknown'}`);
                data.monitor.triage.summaryLines.forEach((item) => lines.push(`  - ${item}`));
            }

            if (data.monitor?.dispatch?.reasoningGate) {
                const gate = data.monitor.dispatch.reasoningGate;
                lines.push(
                    '',
                    'Reasoning budget gate:',
                    `  - automatic LLM calls: ${gate.automaticLlmCalls ? 'enabled' : 'disabled'}`,
                    `  - low reasoning eligible: ${gate.lowReasoningEligible ? 'yes' : 'no'}`,
                    `  - low reasoning interval: ${gate.lowReasoningIntervalSeconds || 'unknown'}s`,
                    `  - cooldown: ${gate.lowReasoningCooldownSeconds || 'unknown'}s`,
                    `  - cooldown remaining: ${gate.cooldownRemainingSeconds || 0}s`,
                    `  - deterministic posture: ${gate.deterministicPosture || 'unknown'}`,
                    `  - deterministic low risk only: ${gate.deterministicLowRiskOnly ? 'yes' : 'no'}`,
                    `  - same fingerprint as previous: ${gate.sameFingerprintAsPrevious ? 'yes' : 'no'}`,
                    `  - daily scheduled cap: ${gate.maxScheduledLlmCallsPerDay ?? 'unknown'}`,
                    `  - high reasoning requires user action: ${gate.highReasoningRequiresUserAction ? 'yes' : 'no'}`
                );
                if (gate.noCallReason) {
                    lines.push(`  - no-call reason: ${gate.noCallReason}`);
                }
            }

            if (data.audit?.yaml?.errors?.length) {
                lines.push('', 'YAML errors:');
                data.audit.yaml.errors.forEach((item) => lines.push(`  ${item.path}: ${item.error}`));
            }

            if (data.coreCheck?.output) {
                lines.push('', 'Core check output:', data.coreCheck.output);
            }

            if (data.logs?.repeated?.length) {
                lines.push('', 'Repeated log issues:');
                data.logs.repeated.forEach((item) => lines.push(`  - ${item.count}x ${formatChangeDeskIssue(item)}`));
            }

            if (data.logs?.issues?.length) {
                lines.push('', 'Apparent log issues:');
                data.logs.issues.slice(0, 8).forEach((item) => lines.push(`  - ${formatChangeDeskIssue(item)}`));
            }

            if (data.monitor?.persistentIssues?.length) {
                lines.push('', 'Persistent monitor issues:');
                data.monitor.persistentIssues.forEach((item) => lines.push(`  - ${item.runsSeen || 0} runs ${formatChangeDeskIssue(item)}`));
            }

            if (data.monitor?.currentIssues?.length) {
                lines.push('', 'Current monitor issues:');
                data.monitor.currentIssues.slice(0, 8).forEach((item) => lines.push(`  - ${formatChangeDeskIssue(item)}`));
            }

            if (data.recommendations?.length) {
                lines.push('', 'Recommendations:');
                data.recommendations.forEach((item) => lines.push(`  - ${item}`));
            }

            return lines.join('\n');
        }

        function renderChangeDesk(data) {
            const generatedAt = data.generatedAt ? new Date(data.generatedAt) : null;
            changeDeskGenerated.textContent = generatedAt
                ? `${generatedAt.toLocaleString()} · ${data.durationMs || 0}ms`
                : '';

            const auditLabel = data.audit?.available
                ? `${data.audit.yaml?.ok || 0}/${data.audit.yaml?.checked || 0} YAML`
                : 'Unavailable';
            const coreLabel = data.coreCheck?.available ? data.coreCheck.status : 'Unavailable';
            const monitorLabel = data.monitor?.available
                ? `${data.monitor.persistentIssues?.length || 0}/${data.monitor.currentIssues?.length || 0}`
                : 'Unavailable';
            const dispatchLabel = data.monitor?.dispatch?.available
                ? (data.monitor.dispatch.meaningfulDelta ? 'Ready' : 'Quiet')
                : 'Unavailable';
            const dispatchStatus = data.monitor?.dispatch?.available
                ? (data.monitor.dispatch.meaningfulDelta ? 'warn' : 'ok')
                : 'unavailable';
            const logErrorCount = (data.logs?.counts?.critical || 0) + (data.logs?.counts?.error || 0);
            const logsLabel = data.logs?.available
                ? `${logErrorCount}/${data.logs.counts?.warning || 0}`
                : 'Unavailable';
            const liveLabel = data.live?.available ? 'Reachable' : 'Unavailable';

            changeDeskSummary.replaceChildren(
                changeDeskMetric('YAML audit', auditLabel, data.audit?.status || 'unavailable'),
                changeDeskMetric('Core check', coreLabel, data.coreCheck?.status || 'unavailable'),
                changeDeskMetric('Monitor P/C', monitorLabel, data.monitor?.status || 'unavailable'),
                changeDeskMetric('Dispatch', dispatchLabel, dispatchStatus),
                changeDeskMetric('Logs E/W', logsLabel, data.logs?.status || 'unavailable'),
                changeDeskMetric('Live API', liveLabel, data.live?.available ? 'ok' : 'unavailable')
            );

            const fragment = document.createDocumentFragment();
            renderChangeDeskAudit(fragment, data.audit);
            renderChangeDeskCoreCheck(fragment, data.coreCheck);
            renderChangeDeskMonitor(fragment, data.monitor);
            renderChangeDeskLogs(fragment, data.logs);
            renderChangeDeskLive(fragment, data.live, data.mcp);
            renderChangeDeskRecommendations(fragment, data.recommendations || []);
            changeDeskContent.replaceChildren(fragment);
            latestChangeDeskSummary = changeDeskPlainText(data);
        }

        function renderChangeDeskError(message) {
            changeDeskGenerated.textContent = '';
            changeDeskSummary.replaceChildren(
                changeDeskMetric('Status', 'Failed', 'failed')
            );
            changeDeskContent.replaceChildren(changeDeskElement('div', 'change-desk-muted', message || 'Change Desk failed.'));
            latestChangeDeskSummary = '';
        }

        async function loadChangeDesk() {
            changeDeskPanel.classList.add('active');
            changeDeskRefresh.disabled = true;
            changeDeskBtn.classList.add('active');
            setChangeDeskLoading();
            setStatus('Collecting Change Desk snapshot...', 'success', false);

            try {
                const response = await fetch(ingressPath('change-desk/summary'));
                const data = await response.json().catch(() => ({}));
                if (!response.ok || !data.success) {
                    throw new Error(data.error || 'Change Desk snapshot failed');
                }

                renderChangeDesk(data);
                setStatus('Change Desk refreshed', 'success', false);
            } catch (err) {
                console.log('Change Desk failed:', err);
                renderChangeDeskError(err.message);
                setStatus('Change Desk failed', 'error', false);
            } finally {
                changeDeskRefresh.disabled = false;
            }
        }

        async function copyChangeDeskSummary() {
            if (!latestChangeDeskSummary) {
                setStatus('No Change Desk summary to copy', 'error', false);
                return;
            }

            const copied = await copyToClipboard(latestChangeDeskSummary);
            setStatus(copied ? 'Change Desk summary copied' : 'Copy failed', copied ? 'success' : 'error', false);
            if (!copied) {
                showManualCopy(latestChangeDeskSummary, 'Copy failed. Use the selected summary below.');
            }
        }

        async function stageChangeDeskReport(report) {
            try {
                const response = await fetch(ingressPath('change-desk/report'), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ report })
                });
                const result = await response.json().catch(() => ({}));

                if (!response.ok || !result.success || !result.path) {
                    throw new Error(result.error || 'Change Desk report staging failed');
                }

                return result;
            } catch (err) {
                console.log('Change Desk report staging failed:', err);
                return null;
            }
        }

        async function insertChangeDeskPrompt() {
            if (!latestChangeDeskSummary) {
                setStatus('Refresh Change Desk first', 'error', false);
                return;
            }

            setStatus('Staging Change Desk report...', 'success', false);
            const staged = await stageChangeDeskReport(latestChangeDeskSummary);
            if (!staged) {
                setStatus('Could not stage Change Desk report', 'error', false);
                showManualCopy(latestChangeDeskSummary, 'Could not stage the report. Copy this summary into Codex.');
                return;
            }

            const promptLines = [
                'Review this Home Assistant Change Desk report:',
                staged.path,
                'Start from the prepared dispatch packet and reasoning budget gate, then review validation blockers, persistent monitor findings, repeated log issues, live Home Assistant reachability, and whether reload or restart is safe.',
                'Do not apply changes without my confirmation.'
            ];
            if (staged.truncated) {
                promptLines.push('Note: the staged report was truncated by the add-on size limit.');
            }
            const prompt = promptLines.join('\n');

            if (insertTextIntoMobileInput(prompt)) {
                setStatus('Change Desk report path added to command line', 'success', false);
                return;
            }

            const inserted = await pasteTextIntoTerminal(prompt);
            setStatus(inserted ? 'Change Desk report path inserted' : 'Could not insert Change Desk report path', inserted ? 'success' : 'error', false);
            if (inserted) {
                focusTerminal(true);
            } else {
                showManualCopy(prompt, 'Could not insert the report path. Copy this into Codex.');
            }
        }

        function setTerminalModeState(mode, announce = true) {
            terminalMode = mode === 'raw' ? 'raw' : 'codex';
            resetTerminalLineBuffer();
            rootElement.dataset.terminalMode = terminalMode;

            terminalModeButtons.forEach((button) => {
                const active = button.getAttribute('data-terminal-mode') === terminalMode;
                button.classList.toggle('active', active);
                button.setAttribute('aria-pressed', active ? 'true' : 'false');
                button.disabled = false;
            });

            if (mobileTerminalInput) {
                mobileTerminalInput.placeholder = terminalMode === 'raw'
                    ? 'Type shell command'
                    : `Type Codex prompt (${SHELL_DISPATCH_PREFIX} shell command)`;
            }

            if (announce) {
                setStatus(
                    terminalMode === 'raw'
                        ? 'Raw shell mode'
                        : 'Codex mode',
                    'success',
                    terminalMode === 'raw'
                );
            }
        }

        async function switchTerminalMode(mode) {
            if (mode !== 'codex' && mode !== 'raw') {
                return false;
            }

            terminalModeButtons.forEach((button) => {
                button.disabled = true;
            });
            setStatus(`Switching to ${mode === 'raw' ? 'raw shell' : 'Codex'} mode...`, 'success', false);

            try {
                const response = await fetch(ingressPath('terminal-mode'), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ mode })
                });

                const result = await response.json().catch(() => ({}));
                if (!response.ok || !result.success) {
                    throw new Error(result.error || 'Mode switch failed');
                }

                setTerminalModeState(result.mode || mode);
                scheduleTerminalViewportSync(true);
                if (isMobileInputMode()) {
                    focusMobileTerminalInput();
                } else {
                    focusTerminal(true);
                }
                return true;
            } catch (err) {
                console.log('Terminal mode switch failed:', err);
                setTerminalModeState(terminalMode, false);
                setStatus('Could not switch terminal mode', 'error', false);
                return false;
            }
        }

        function isMobileInputMode() {
            return Boolean(mobileTerminalInput && rootElement.classList.contains('touch-ui'));
        }

        function resetTerminalLineBuffer() {
            terminalLineBuffer = '';
            terminalTextSource = null;
            lastPrintableKey = null;
            lastPasteText = null;
        }

        function shouldAcceptTerminalTextSource(source) {
            if (!source) {
                return true;
            }

            if (!terminalTextSource) {
                terminalTextSource = source;
                return true;
            }

            return terminalTextSource === source;
        }

        function shouldProcessTerminalEditSource(source) {
            return !terminalTextSource || terminalTextSource === source;
        }

        function appendTerminalLineText(text, source = '') {
            if (!text) {
                return;
            }

            if (!shouldAcceptTerminalTextSource(source)) {
                return;
            }

            if (
                source === 'beforeinput' &&
                lastPrintableKey &&
                lastPrintableKey.text === text &&
                Date.now() - lastPrintableKey.at < 250
            ) {
                lastPrintableKey = null;
                return;
            }

            if (
                source === 'beforeinput' &&
                lastPasteText &&
                lastPasteText.text === text &&
                Date.now() - lastPasteText.at < 250
            ) {
                lastPasteText = null;
                return;
            }

            terminalLineBuffer = `${terminalLineBuffer}${text}`.slice(-512);
        }

        function shellCommandFromDispatchPrefix(text) {
            const normalized = text.replace(/^\s+/, '');
            if (!normalized.startsWith(SHELL_DISPATCH_PREFIX)) {
                return null;
            }

            return normalized.slice(SHELL_DISPATCH_PREFIX.length).replace(/^\s+/, '');
        }

        function repairDuplicateFanout(text) {
            const pending = [];
            let repaired = '';

            for (const char of String(text || '')) {
                const index = pending.indexOf(char);
                if (index !== -1 && index < 3) {
                    pending.splice(index, 1);
                    continue;
                }

                repaired += char;
                pending.push(char);
                if (pending.length > 3) {
                    pending.shift();
                }
            }

            return repaired.replace(/\s+/g, ' ').trim();
        }

        function normalizeDispatchCommand(command) {
            let normalized = String(command || '').trim();
            let strippedPrefixFragment = false;

            while (normalized.startsWith(SHELL_DISPATCH_PREFIX)) {
                normalized = normalized.slice(SHELL_DISPATCH_PREFIX.length).replace(/^\s+/, '');
                strippedPrefixFragment = true;
            }

            if (!strippedPrefixFragment) {
                return String(command || '').trim();
            }

            const repaired = repairDuplicateFanout(normalized);
            const reduction = normalized.length > 0
                ? (normalized.length - repaired.length) / normalized.length
                : 0;

            return reduction >= 0.35 ? repaired : normalized;
        }

        function promptPasteText(text) {
            return String(text || '').replace(/(?:\r\n|\r|\n)+$/g, '');
        }

        function stopTerminalInputEvent(event) {
            event.preventDefault();
            event.stopPropagation();
            if (typeof event.stopImmediatePropagation === 'function') {
                event.stopImmediatePropagation();
            }
        }

        function claimTerminalEvent(event) {
            if (trackedTerminalEvents.has(event)) {
                return false;
            }

            trackedTerminalEvents.add(event);

            const signature = [
                event.type || '',
                event.key || '',
                event.code || '',
                event.inputType || '',
                event.data || ''
            ].join(':');
            const now = Date.now();
            if (
                signature &&
                lastTerminalEventSignature &&
                lastTerminalEventSignature.signature === signature &&
                now - lastTerminalEventSignature.at < 25
            ) {
                return false;
            }

            lastTerminalEventSignature = { signature, at: now };
            return true;
        }

        function showShellOutput(command, result) {
            const exitText = Number.isInteger(result.exitCode) ? `exit ${result.exitCode}` : 'exit unknown';
            const truncatedText = result.truncated ? ' truncated' : '';
            const output = result.output || `(no output; ${exitText})`;

            latestShellOutput = output;
            shellOutputMessage.textContent = `$ ${command} (${exitText}${truncatedText})`;
            shellOutputText.textContent = output;
            shellOutputPanel.classList.add('active');
        }

        async function dispatchShellCommand(command) {
            try {
                shellOutputPanel.classList.remove('active');
                const response = await fetch(ingressPath('terminal-shell-command'), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ command })
                });

                const result = await response.json().catch(() => ({}));
                if (!response.ok || !result.success) {
                    throw new Error(result.error || 'Shell command dispatch failed');
                }

                setTerminalModeState(result.mode || terminalMode);
                scheduleTerminalViewportSync(true);
                if (isMobileInputMode()) {
                    focusMobileTerminalInput();
                } else {
                    focusTerminal(true);
                }

                if (result.timedOut) {
                    setStatus('Shell command is still running', 'success', true);
                    return true;
                }

                showShellOutput(result.command || command, result);
                setStatus(
                    result.exitCode === 0 ? 'Shell command completed' : `Shell command exited ${result.exitCode}`,
                    result.exitCode === 0 ? 'success' : 'error',
                    false
                );
                return true;
            } catch (err) {
                console.log('Shell command dispatch failed:', err);
                setStatus('Could not send command to shell', 'error', false);
                return false;
            }
        }

        async function dispatchShellCommandFromPrompt(command) {
            const cleared = await sendTerminalControl('ctrl-u');
            if (!cleared) {
                console.log('Could not clear Codex prompt before shell dispatch');
            }

            if (!command) {
                setStatus(`Type a shell command after ${SHELL_DISPATCH_PREFIX}`, 'error', false);
                focusTerminal(true);
                return;
            }

            await dispatchShellCommand(command);
        }

        function dispatchTerminalLineBuffer(event) {
            if (Date.now() < shellDispatchBlockInputUntil) {
                stopTerminalInputEvent(event);
                return true;
            }

            if (terminalMode !== 'codex') {
                resetTerminalLineBuffer();
                return false;
            }

            const shellCommand = shellCommandFromDispatchPrefix(terminalLineBuffer);
            resetTerminalLineBuffer();
            if (shellCommand === null) {
                return false;
            }

            stopTerminalInputEvent(event);
            shellDispatchBlockInputUntil = Date.now() + 350;
            dispatchShellCommandFromPrompt(normalizeDispatchCommand(shellCommand));
            return true;
        }

        function handleTerminalPromptKeydown(event, source = 'dom-keydown') {
            if (event.defaultPrevented || event.isComposing) {
                return true;
            }

            if (terminalMode !== 'codex') {
                resetTerminalLineBuffer();
                return true;
            }

            if (event.key === 'Enter') {
                return !dispatchTerminalLineBuffer(event);
            }

            if (event.key === 'Backspace') {
                if (shouldProcessTerminalEditSource(source)) {
                    terminalLineBuffer = terminalLineBuffer.slice(0, -1);
                }
                return true;
            }

            if (
                event.key === 'Escape' ||
                event.key.startsWith('Arrow') ||
                event.key === 'PageUp' ||
                event.key === 'PageDown'
            ) {
                resetTerminalLineBuffer();
                return true;
            }

            if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'u') {
                resetTerminalLineBuffer();
                return true;
            }

            if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'v') {
                return true;
            }

            if (event.ctrlKey || event.metaKey || event.altKey) {
                resetTerminalLineBuffer();
                return true;
            }

            if (event.key.length === 1) {
                appendTerminalLineText(event.key, source);
