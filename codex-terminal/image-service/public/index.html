<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codex Terminal Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #101314;
            --panel: #171b1d;
            --panel-strong: #202527;
            --border: #344044;
            --border-soft: #263033;
            --text: #f3efe2;
            --muted: #a7b0ac;
            --accent: #f0b45b;
            --accent-strong: #ffc86b;
            --accent-cool: #79c7c5;
            --success: #8ec07c;
            --danger: #fb6f5f;
            --button: #263c42;
            --button-hover: #315057;
            --button-active: #20343a;
            --shadow: rgba(0, 0, 0, 0.35);
        }

        body {
            font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
        }

        #container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #header {
            background: var(--panel);
            padding: 9px 14px;
            border-bottom: 1px solid var(--border-soft);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            gap: 12px;
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.03), 0 10px 30px var(--shadow);
        }

        #header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            font-size: 14px;
            font-weight: 650;
            color: var(--text);
            white-space: nowrap;
        }

        .brand-mark {
            display: inline-grid;
            place-items: center;
            width: 30px;
            height: 24px;
            border: 1px solid rgba(121, 199, 197, 0.45);
            border-radius: 6px;
            color: var(--accent-cool);
            background: #11191b;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 12px;
            letter-spacing: 0;
        }

        .status-pill {
            color: var(--accent);
            background: rgba(240, 180, 91, 0.1);
            border: 1px solid rgba(240, 180, 91, 0.26);
            border-radius: 999px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
        }

        #header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .header-btn {
            background: var(--button);
            color: var(--text);
            border: 1px solid rgba(121, 199, 197, 0.28);
            padding: 7px 11px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            min-height: 32px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        .header-btn:hover {
            background: var(--button-hover);
            border-color: rgba(121, 199, 197, 0.5);
        }

        .header-btn:active {
            background: var(--button-active);
        }

        .header-btn.active {
            background: rgba(240, 180, 91, 0.2);
            border-color: rgba(240, 180, 91, 0.65);
            color: var(--accent-strong);
        }

        .header-btn:disabled {
            background: #2d3436;
            cursor: not-allowed;
            opacity: 0.5;
        }

        #voice-btn.recording {
            background: #51312f;
            border-color: rgba(251, 111, 95, 0.7);
            color: #fff0e8;
            animation: pulse 1.5s infinite;
        }

        #touch-select-btn {
            display: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        #status {
            font-size: 12px;
            color: var(--muted);
            padding: 0 12px;
            transition: all 0.2s ease;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: min(44vw, 520px);
        }

        #status.success {
            color: var(--success);
        }

        #status.error {
            color: var(--danger);
        }

        #status:hover {
            opacity: 0.8;
        }

        #status[style*="cursor: pointer"] {
            user-select: all;
        }

        #terminal-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #050708;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }

        #terminal-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #050708;
        }

        #drop-zone {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 14, 15, 0.88);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            pointer-events: none;
        }

        #drop-zone.active {
            display: flex;
            pointer-events: auto;
        }

        #drop-zone-text {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            text-align: center;
            padding: 18px 24px;
            border: 1px solid rgba(240, 180, 91, 0.55);
            border-radius: 8px;
            background: rgba(23, 27, 29, 0.94);
            box-shadow: 0 18px 45px var(--shadow);
        }

        #file-input {
            display: none;
        }

        #manual-copy-panel {
            position: fixed;
            left: 16px;
            right: 16px;
            bottom: 16px;
            z-index: 2500;
            display: none;
            gap: 10px;
            flex-direction: column;
            padding: 12px;
            border: 1px solid rgba(121, 199, 197, 0.45);
            border-radius: 8px;
            background: rgba(23, 27, 29, 0.98);
            box-shadow: 0 18px 45px var(--shadow);
        }

        #manual-copy-panel.active {
            display: flex;
        }

        #manual-copy-message {
            color: var(--text);
            font-size: 13px;
            line-height: 1.4;
        }

        #manual-copy-text {
            width: 100%;
            min-height: 72px;
            resize: vertical;
            border: 1px solid var(--border-soft);
            border-radius: 6px;
            background: #0d1112;
            color: var(--text);
            padding: 10px;
            font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Voice Modal */
        #voice-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.78);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        #voice-modal.active {
            display: flex;
        }

        #voice-modal-content {
            background: var(--panel);
            border-radius: 8px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
            border: 1px solid var(--border);
            box-shadow: 0 24px 60px var(--shadow);
        }

        #voice-modal-title {
            font-size: 18px;
            font-weight: 650;
            margin-bottom: 16px;
            color: var(--text);
        }

        #voice-transcript {
            background: #0d1112;
            border: 1px solid var(--border-soft);
            border-radius: 6px;
            padding: 12px;
            min-height: 100px;
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 16px;
            color: var(--text);
            font-size: 14px;
            line-height: 1.5;
        }

        #voice-transcript.listening {
            border-color: var(--danger);
        }

        #voice-transcript:empty::before {
            content: "Click 'Start Recording' and speak...";
            color: #6f7b7a;
            font-style: italic;
        }

        .modal-buttons {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .modal-btn {
            padding: 8px 16px;
            border: 1px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 650;
        }

        .modal-btn-primary {
            background: var(--button);
            border-color: rgba(121, 199, 197, 0.35);
            color: var(--text);
        }

        .modal-btn-primary:hover {
            background: var(--button-hover);
        }

        .modal-btn-danger {
            background: #51312f;
            border-color: rgba(251, 111, 95, 0.5);
            color: #fff0e8;
        }

        .modal-btn-danger:hover {
            background: #633632;
        }

        .modal-btn-secondary {
            background: var(--panel-strong);
            border-color: var(--border-soft);
            color: var(--text);
        }

        .modal-btn-secondary:hover {
            background: #2c3336;
        }

        #voice-status {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 12px;
            min-height: 18px;
        }

        #voice-status.listening {
            color: var(--danger);
        }

        @media (max-width: 760px) {
            #header {
                align-items: flex-start;
                flex-direction: column;
                gap: 8px;
            }

            #header-actions {
                width: 100%;
                justify-content: space-between;
                gap: 8px;
            }

            #status {
                flex: 1;
                max-width: none;
                padding-left: 0;
            }

            .header-btn {
                padding: 7px 9px;
            }

            #touch-select-btn {
                display: flex;
            }

            .status-pill {
                display: none;
            }
        }

        @media (pointer: coarse) {
            #touch-select-btn {
                display: flex;
            }
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="header">
            <div id="header-title">
                <span class="brand-mark">&gt;_</span>
                <span>Codex Terminal Pro</span>
                <span class="status-pill">/config</span>
            </div>
            <div id="header-actions">
                <span id="status"></span>
                <button id="voice-btn" class="header-btn">
                    <span>🎤</span>
                    <span>Voice Input</span>
                </button>
                <button id="touch-select-btn" class="header-btn" title="Touch-drag terminal text to copy">
                    <span>▣</span>
                    <span>Select Text</span>
                </button>
                <button id="upload-btn" class="header-btn">
                    <span>📎</span>
                    <span>Upload Image</span>
                </button>
            </div>
        </div>
        <div id="terminal-container">
            <iframe id="terminal-frame" src="about:blank"></iframe>
            <div id="drop-zone">
                <div id="drop-zone-text">Drop image to upload into Codex</div>
            </div>
        </div>
    </div>
    <input type="file" id="file-input" accept="image/*,.heic,.heif" multiple>

    <div id="manual-copy-panel" aria-live="polite">
        <div id="manual-copy-message">Copy this text manually.</div>
        <textarea id="manual-copy-text" readonly></textarea>
        <div class="modal-buttons">
            <button id="manual-copy-dismiss" class="modal-btn modal-btn-secondary">Dismiss</button>
        </div>
    </div>

    <!-- Voice Input Modal -->
    <div id="voice-modal">
        <div id="voice-modal-content">
            <div id="voice-modal-title">🎤 Voice Input</div>
            <div id="voice-status"></div>
            <div id="voice-transcript" contenteditable="true"></div>
            <div class="modal-buttons">
                <button id="voice-record-btn" class="modal-btn modal-btn-danger">Start Recording</button>
                <button id="voice-copy-btn" class="modal-btn modal-btn-primary" style="display: none;">Copy Text</button>
                <button id="voice-close-btn" class="modal-btn modal-btn-secondary">Close</button>
            </div>
        </div>
    </div>

    <script>
        let ttydPort = 7681;
        let uploadDir = '/data/images';
        let lastCopiedTerminalSelection = '';
        let lastCopiedTerminalSelectionAt = 0;
        let lastImagePasteSignature = '';
        let lastImagePasteAt = 0;
        let touchSelectionMode = false;
        const handledImagePasteEvents = new WeakSet();

        function ingressPath(path) {
            const cleanPath = String(path).replace(/^\/+/, '');
            const basePath = window.location.pathname.replace(/\/+$/, '');

            if (!basePath) {
                return `/${cleanPath}`;
            }

            return `${basePath}/${cleanPath}`;
        }

        // Fetch configuration and load ttyd
        // Use relative paths for Home Assistant ingress compatibility
        fetch(ingressPath('config'))
            .then(res => res.json())
            .then(config => {
                ttydPort = config.ttydPort;
                uploadDir = config.uploadDir;
                console.log('Config loaded:', config);
                // Load ttyd via proxy endpoint
                loadTerminal();
            })
            .catch(err => {
                console.error('Failed to load config:', err);
                // Fallback: load terminal anyway
                loadTerminal();
            });

        function loadTerminal() {
            const iframe = document.getElementById('terminal-frame');
            // Use an ingress-aware absolute path to avoid //terminal/ when Home
            // Assistant serves the add-on from a double-slash ingress base URL.
            iframe.src = ingressPath('terminal/');
            installTerminalSelectionCopy();
        }

        const status = document.getElementById('status');
        const uploadBtn = document.getElementById('upload-btn');
        const touchSelectBtn = document.getElementById('touch-select-btn');
        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');
        const manualCopyPanel = document.getElementById('manual-copy-panel');
        const manualCopyText = document.getElementById('manual-copy-text');
        const manualCopyMessage = document.getElementById('manual-copy-message');
        const manualCopyDismiss = document.getElementById('manual-copy-dismiss');

        function setStatus(message, type = '', persistent = false) {
            status.textContent = message;
            status.className = type;
            if (message && !persistent) {
                setTimeout(() => setStatus(''), 5000);
            }
        }

        function installTerminalSelectionCopy() {
            const iframe = document.getElementById('terminal-frame');

            iframe.addEventListener('load', () => {
                setTimeout(() => {
                    let iframeWindow;
                    let iframeDocument;
                    let lastKnownTerminalSelection = '';
                    let dragStartCell = null;
                    let touchSelectStartCell = null;
                    let touchSelectCurrentCell = null;

                    try {
                        iframeWindow = iframe.contentWindow;
                        iframeDocument = iframeWindow?.document;
                    } catch (err) {
                        console.log('Cannot attach terminal selection copier:', err);
                        return;
                    }

                    if (!iframeWindow || !iframeDocument) {
                        return;
                    }

                    if (iframeWindow.__codexTerminalSelectionCopyInstalled) {
                        return;
                    }
                    iframeWindow.__codexTerminalSelectionCopyInstalled = true;

                    const rememberTerminalSelection = () => {
                        const selectedText = getTerminalSelection(iframeWindow);
                        if (selectedText.trim()) {
                            lastKnownTerminalSelection = selectedText;
                        }
                    };

                    const copyTerminalSelection = () => {
                        if (touchSelectionMode) {
                            return;
                        }

                        rememberTerminalSelection();
                        const selectedText = getTerminalSelection(iframeWindow) || lastKnownTerminalSelection;

                        if (!selectedText.trim()) {
                            copyTerminalSelectionWithTtyd(iframeDocument);
                            return;
                        }

                        const now = Date.now();
                        if (
                            selectedText === lastCopiedTerminalSelection &&
                            now - lastCopiedTerminalSelectionAt < 1000
                        ) {
                            return;
                        }

                        const copyResult = copyToClipboardFromGesture(selectedText, iframeDocument);
                        if (copyResult && typeof copyResult.then === 'function') {
                            copyResult.then((copied) => {
                                updateTerminalSelectionCopyStatus(copied, selectedText);
                            });
                        } else {
                            updateTerminalSelectionCopyStatus(Boolean(copyResult), selectedText);
                        }
                    };

                    const rememberDragStart = (event) => {
                        if (event.button !== 0) {
                            return;
                        }
                        dragStartCell = getTerminalCellFromMouseEvent(iframeWindow, event);
                    };

                    const copyDraggedTerminalText = (event) => {
                        rememberTerminalSelection();
                        const dragEndCell = getTerminalCellFromMouseEvent(iframeWindow, event);
                        const draggedText = getTerminalTextFromDrag(iframeWindow, dragStartCell, dragEndCell);
                        dragStartCell = null;

                        if (draggedText.trim()) {
                            const copyResult = copyToClipboardFromGesture(draggedText, iframeDocument);
                            if (copyResult && typeof copyResult.then === 'function') {
                                copyResult.then((copied) => {
                                    updateTerminalSelectionCopyStatus(copied, draggedText);
                                });
                            } else {
                                updateTerminalSelectionCopyStatus(Boolean(copyResult), draggedText);
                            }
                            return;
                        }

                        copyTerminalSelection();
                    };

                    const rememberTouchSelectionStart = (event) => {
                        if (!touchSelectionMode || event.touches.length !== 1) {
                            return;
                        }

                        touchSelectStartCell = getTerminalCellFromTouchEvent(iframeWindow, event);
                        touchSelectCurrentCell = touchSelectStartCell;

                        if (!touchSelectStartCell) {
                            return;
                        }

                        event.preventDefault();
                        event.stopPropagation();
                        selectTerminalRange(iframeWindow, touchSelectStartCell, touchSelectCurrentCell);
                        setStatus('Drag to select terminal text', 'success', false);
                    };

                    const updateTouchSelection = (event) => {
                        if (!touchSelectionMode || !touchSelectStartCell || event.touches.length !== 1) {
                            return;
                        }

                        const currentCell = getTerminalCellFromTouchEvent(iframeWindow, event);
                        if (!currentCell) {
                            return;
                        }

                        touchSelectCurrentCell = currentCell;
                        event.preventDefault();
                        event.stopPropagation();
                        selectTerminalRange(iframeWindow, touchSelectStartCell, touchSelectCurrentCell);
                    };

                    const finishTouchSelection = (event) => {
                        if (!touchSelectionMode || !touchSelectStartCell) {
                            return;
                        }

                        const startCell = touchSelectStartCell;
                        const endCell = getTerminalCellFromTouchEvent(iframeWindow, event) || touchSelectCurrentCell;
                        event.preventDefault();
                        event.stopPropagation();

                        const selectedText = getTerminalTextFromDrag(iframeWindow, startCell, endCell);
                        selectTerminalRange(iframeWindow, startCell, endCell);
                        touchSelectStartCell = null;
                        touchSelectCurrentCell = null;
                        setTouchSelectionMode(false);

                        if (!selectedText.trim()) {
                            setStatus('No terminal text selected', 'error', false);
                            return;
                        }

                        const copyResult = copyToClipboardFromGesture(selectedText, iframeDocument);
                        if (copyResult && typeof copyResult.then === 'function') {
                            copyResult.then((copied) => {
                                updateTerminalSelectionCopyStatus(copied, selectedText, { showManualFallback: true });
                            });
                        } else {
                            updateTerminalSelectionCopyStatus(Boolean(copyResult), selectedText, { showManualFallback: true });
                        }
                    };

                    iframeDocument.addEventListener('selectionchange', rememberTerminalSelection, true);
                    iframeDocument.addEventListener('mousedown', rememberDragStart, true);
                    iframeDocument.addEventListener('mouseup', copyDraggedTerminalText, true);
                    iframeDocument.addEventListener('touchstart', rememberTouchSelectionStart, { capture: true, passive: false });
                    iframeDocument.addEventListener('touchmove', updateTouchSelection, { capture: true, passive: false });
                    iframeDocument.addEventListener('touchcancel', finishTouchSelection, { capture: true, passive: false });
                    iframeDocument.addEventListener('touchend', copyTerminalSelection, true);
                    iframeDocument.addEventListener('touchend', finishTouchSelection, { capture: true, passive: false });
                    iframeDocument.addEventListener('keyup', (event) => {
                        if (event.key === 'Shift' || event.key.startsWith('Arrow') || event.key === 'PageUp' || event.key === 'PageDown') {
                            rememberTerminalSelection();
                            copyTerminalSelection();
                        }
                    }, true);

                    waitForTerminalApi(iframeWindow, () => {
                        try {
                            iframeWindow.term.onSelectionChange(rememberTerminalSelection);
                        } catch (err) {
                            console.log('Cannot attach xterm selection tracker:', err);
                        }

                        installOsc52ClipboardBridge(iframeWindow, iframeDocument);
                    });
                }, 500);
            });
        }

        function setTouchSelectionMode(enabled) {
            touchSelectionMode = Boolean(enabled);
            if (touchSelectBtn) {
                touchSelectBtn.classList.toggle('active', touchSelectionMode);
                touchSelectBtn.setAttribute('aria-pressed', touchSelectionMode ? 'true' : 'false');
            }

            if (touchSelectionMode) {
                setStatus('Select mode: touch-drag terminal text', 'success', true);
            } else if (status.textContent === 'Select mode: touch-drag terminal text') {
                setStatus('');
            }
        }

        touchSelectBtn?.addEventListener('click', () => {
            setTouchSelectionMode(!touchSelectionMode);
        });

        function copyTerminalSelectionWithTtyd(iframeDocument) {
            try {
                return iframeDocument.execCommand('copy');
            } catch (err) {
                console.log('Cannot trigger ttyd terminal copy:', err);
                return false;
            }
        }

        function installOsc52ClipboardBridge(iframeWindow, iframeDocument) {
            const term = iframeWindow.term;
            if (
                !term ||
                !term.parser ||
                typeof term.parser.registerOscHandler !== 'function' ||
                iframeWindow.__codexOsc52ClipboardInstalled
            ) {
                return;
            }

            iframeWindow.__codexOsc52ClipboardInstalled = true;

            term.parser.registerOscHandler(52, (data) => {
                const text = decodeOsc52ClipboardData(data);
                if (!text) {
                    return false;
                }

                const copyResult = copyToClipboardFromGesture(text, iframeDocument);
                if (copyResult && typeof copyResult.then === 'function') {
                    copyResult.then((copied) => {
                        updateTerminalSelectionCopyStatus(copied, text);
                    });
                } else {
                    updateTerminalSelectionCopyStatus(Boolean(copyResult), text);
                }

                return true;
            });
        }

        function decodeOsc52ClipboardData(data) {
            const separator = data.indexOf(';');
            if (separator === -1) {
                return '';
            }

            const encoded = data.slice(separator + 1);
            if (!encoded || encoded === '?') {
                return '';
            }

            try {
                const binary = atob(encoded);
                const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
                return new TextDecoder().decode(bytes).replace(/\u00a0/g, ' ');
            } catch (err) {
                console.log('Cannot decode OSC 52 clipboard data:', err);
                return '';
            }
        }

        function waitForTerminalApi(iframeWindow, callback, attempt = 0) {
            if (iframeWindow.term && typeof iframeWindow.term.getSelection === 'function') {
                callback();
                return;
            }

            if (attempt >= 40) {
                console.log('ttyd terminal API was not available for selection copy');
                return;
            }

            setTimeout(() => waitForTerminalApi(iframeWindow, callback, attempt + 1), 250);
        }

        function getTerminalSelection(iframeWindow) {
            let selectedText = '';

            try {
                if (iframeWindow.term && typeof iframeWindow.term.getSelection === 'function') {
                    selectedText = String(iframeWindow.term.getSelection() || '');
                }
            } catch (err) {
                console.log('Cannot read xterm selection:', err);
            }

            if (!selectedText) {
                try {
                    selectedText = String(iframeWindow.getSelection()?.toString() || '');
                } catch (err) {
                    console.log('Cannot read terminal document selection:', err);
                }
            }

            return selectedText.replace(/\u00a0/g, ' ');
        }

        function getTerminalCellFromMouseEvent(iframeWindow, event) {
            return getTerminalCellFromPoint(iframeWindow, event.clientX, event.clientY);
        }

        function getTerminalCellFromTouchEvent(iframeWindow, event) {
            const touch = event.touches?.[0] || event.changedTouches?.[0];
            if (!touch) {
                return null;
            }

            return getTerminalCellFromPoint(iframeWindow, touch.clientX, touch.clientY);
        }

        function getTerminalCellFromPoint(iframeWindow, clientX, clientY) {
            const term = iframeWindow.term;
            if (!term || !term.cols || !term.rows) {
                return null;
            }

            const screen = iframeWindow.document.querySelector('.xterm-screen') ||
                iframeWindow.document.querySelector('.xterm') ||
                iframeWindow.document.querySelector('.terminal');
            if (!screen) {
                return null;
            }

            const rect = screen.getBoundingClientRect();
            if (
                clientX < rect.left ||
                clientX > rect.right ||
                clientY < rect.top ||
                clientY > rect.bottom
            ) {
                return null;
            }

            const cellWidth = rect.width / term.cols;
            const cellHeight = rect.height / term.rows;
            if (!cellWidth || !cellHeight) {
                return null;
            }

            return {
                col: Math.max(0, Math.min(term.cols - 1, Math.floor((clientX - rect.left) / cellWidth))),
                row: Math.max(0, Math.min(term.rows - 1, Math.floor((clientY - rect.top) / cellHeight)))
            };
        }

        function orderedTerminalCells(startCell, endCell) {
            if (!startCell || !endCell) {
                return { start: null, end: null };
            }

            const start = (startCell.row < endCell.row ||
                (startCell.row === endCell.row && startCell.col <= endCell.col)) ? startCell : endCell;
            const end = start === startCell ? endCell : startCell;
            return { start, end };
        }

        function selectTerminalRange(iframeWindow, startCell, endCell) {
            const term = iframeWindow.term;
            const buffer = term?.buffer?.active;
            if (!term || typeof term.select !== 'function' || !buffer || !startCell || !endCell) {
                return false;
            }

            const { start, end } = orderedTerminalCells(startCell, endCell);
            if (!start || !end) {
                return false;
            }

            const rowDelta = Math.max(0, end.row - start.row);
            const length = Math.max(1, (rowDelta * term.cols) + (end.col - start.col) + 1);
            term.select(start.col, (buffer.viewportY || 0) + start.row, length);
            return true;
        }

        function getTerminalTextFromDrag(iframeWindow, startCell, endCell) {
            const term = iframeWindow.term;
            const buffer = term?.buffer?.active;
            if (!buffer || !startCell || !endCell) {
                return '';
            }

            if (startCell.row === endCell.row && Math.abs(startCell.col - endCell.col) < 1) {
                return '';
            }

            const { start, end } = orderedTerminalCells(startCell, endCell);
            const viewportY = buffer.viewportY || 0;
            const lines = [];

            for (let row = start.row; row <= end.row; row += 1) {
                const line = buffer.getLine(viewportY + row);
                if (!line) {
                    continue;
                }

                const text = line.translateToString(false).replace(/\u00a0/g, ' ');
                if (row === start.row && row === end.row) {
                    lines.push(text.slice(start.col, end.col + 1).trimEnd());
                } else if (row === start.row) {
                    lines.push(text.slice(start.col).trimEnd());
                } else if (row === end.row) {
                    lines.push(text.slice(0, end.col + 1).trimEnd());
                } else {
                    lines.push(text.trimEnd());
                }
            }

            return lines.join('\n').trim();
        }

        function updateTerminalSelectionCopyStatus(copied, selectedText, options = {}) {
            if (copied) {
                lastCopiedTerminalSelection = selectedText;
                lastCopiedTerminalSelectionAt = Date.now();
                setStatus('Copied terminal selection', 'success', false);
            } else if (options.showManualFallback) {
                lastCopiedTerminalSelection = selectedText;
                lastCopiedTerminalSelectionAt = Date.now();
                showManualCopy(selectedText, 'Copy failed. Tap and hold to Copy, or use the selected text below.');
                setStatus('Selection ready for manual copy', 'error', false);
            } else {
                lastCopiedTerminalSelection = selectedText;
                lastCopiedTerminalSelectionAt = Date.now();
                setStatus('');
            }
        }

        function copyToClipboardFromGesture(text, clipboardDocument = document) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                return navigator.clipboard.writeText(text)
                    .then(() => true)
                    .catch((err) => {
                        console.log('Clipboard API failed:', err);
                        return fallbackCopyToClipboard(text, clipboardDocument);
                    });
            }

            return fallbackCopyToClipboard(text, clipboardDocument);
        }

        function isImageFile(file) {
            if (!file) {
                return false;
            }

            if (file.type && file.type.startsWith('image/')) {
                return true;
            }

            return /\.(heic|heif|jpe?g|png|gif|webp|svg)$/i.test(file.name || '');
        }

        function imageFilesFromFileList(fileList) {
            return Array.from(fileList || []).filter(isImageFile);
        }

        function imageFilesFromItems(items) {
            return Array.from(items || [])
                .filter((item) => item.kind === 'file' && typeof item.getAsFile === 'function')
                .map((item) => item.getAsFile())
                .filter(isImageFile);
        }

        function imageFilesFromTransfer(transfer) {
            if (!transfer) {
                return [];
            }

            const files = [
                ...imageFilesFromFileList(transfer.files),
                ...imageFilesFromItems(transfer.items)
            ];
            const seen = new Set();

            return files.filter((file) => {
                const key = `${file.name || 'image'}:${file.type || 'unknown'}:${file.size}:${file.lastModified || 0}`;
                if (seen.has(key)) {
                    return false;
                }
                seen.add(key);
                return true;
            });
        }

        function imageFilesFromEvent(e) {
            return [
                ...imageFilesFromTransfer(e.clipboardData),
                ...imageFilesFromTransfer(e.dataTransfer)
            ];
        }

        function imagePasteSignature(files) {
            return files
                .map((file) => `${file.name || 'image'}:${file.type || 'unknown'}:${file.size}:${file.lastModified || 0}`)
                .join('|');
        }

        async function uploadImageFiles(files, sourceLabel = 'selected') {
            const imageFiles = imageFilesFromFileList(files);

            if (imageFiles.length === 0) {
                setStatus('Please select an image file', 'error');
                return;
            }

            if (imageFiles.length > 1) {
                setStatus(`Uploading ${imageFiles.length} images...`, 'success');
            } else if (sourceLabel === 'pasted') {
                setStatus('Uploading pasted image...', 'success');
            }

            for (const file of imageFiles) {
                await uploadImage(file);
            }
        }

        async function uploadImage(file) {
            if (!isImageFile(file)) {
                setStatus('Please select an image file', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('image', file);

            uploadBtn.innerHTML = '<span class="spinner"></span><span>Uploading...</span>';
            uploadBtn.disabled = true;

            try {
                // Use relative path for Home Assistant ingress compatibility
                const response = await fetch(ingressPath('upload'), {
                    method: 'POST',
                    body: formData
                });

                // Check if response is ok (status 200-299)
                if (!response.ok) {
                    const text = await response.text();
                    let errorMessage = 'Upload failed';
                    try {
                        const errorJson = JSON.parse(text);
                        errorMessage = errorJson.error || errorMessage;
                    } catch {
                        errorMessage = text || errorMessage;
                    }
                    throw new Error(errorMessage);
                }

                const result = await response.json();

                if (result.success) {
                    const filePath = result.path;

                    // Display full path persistently with click-to-copy functionality
                    setStatus(`📋 ${filePath} (click to select)`, 'success', true);
                    console.log('Image uploaded:', filePath);

                    // Make status clickable to copy or manually select text.
                    status.style.cursor = 'pointer';
                    status.style.userSelect = 'text';

                    status.onclick = async () => {
                        const copied = await copyToClipboard(filePath);
                        if (copied) {
                            const originalText = status.textContent;
                            setStatus('✓ Copied!', 'success', false);
                            setTimeout(() => {
                                setStatus(originalText, 'success', true);
                            }, 2000);
                        } else {
                            showManualCopy(filePath, 'Tap and hold the path to Copy, then paste it into the terminal.');
                        }
                    };

                    const inserted = await insertTextIntoTerminal(`${filePath} `);
                    if (inserted) {
                        await copyToClipboard(filePath);
                        setStatus(`📎 Inserted ${filePath}`, 'success', true);
                    } else {
                        const copied = await copyToClipboard(filePath);
                        if (copied) {
                            setStatus(`📋 ${filePath} copied. Paste it into the terminal.`, 'success', true);
                        } else {
                            showManualCopy(filePath, 'Tap and hold the path to Copy, then paste it into the terminal.');
                        }
                    }
                } else {
                    setStatus(result.error || 'Upload failed', 'error');
                }
            } catch (error) {
                console.error('Upload error:', error);
                setStatus('Upload failed: ' + error.message, 'error');
            } finally {
                uploadBtn.innerHTML = '<span>📎</span><span>Upload Image</span>';
                uploadBtn.disabled = false;
            }
        }

        // Upload button click
        uploadBtn.addEventListener('click', () => {
            fileInput.click();
        });

        // File input change
        fileInput.addEventListener('change', async (e) => {
            if (e.target.files.length > 0) {
                await uploadImageFiles(e.target.files, 'selected');
                e.target.value = '';
            }
        });

        async function handleImagePaste(e) {
            if (
                e.type === 'beforeinput' &&
                e.inputType !== 'insertFromPaste' &&
                e.inputType !== 'insertFromDrop'
            ) {
                return false;
            }

            if (handledImagePasteEvents.has(e)) {
                return true;
            }

            const files = imageFilesFromEvent(e);
            if (files.length === 0) {
                return false;
            }

            const signature = imagePasteSignature(files);
            const now = Date.now();
            if (signature && signature === lastImagePasteSignature && now - lastImagePasteAt < 1500) {
                e.preventDefault();
                e.stopPropagation();
                handledImagePasteEvents.add(e);
                return true;
            }

            handledImagePasteEvents.add(e);
            lastImagePasteSignature = signature;
            lastImagePasteAt = now;
            e.preventDefault();
            e.stopPropagation();

            console.log('Image paste detected:', files.map((file) => file.type || file.name));
            await uploadImageFiles(files, 'pasted');
            return true;
        }

        // Paste handling. Capture phase matters because ttyd/xterm handles
        // paste inside an iframe before normal wrapper listeners can see it.
        document.addEventListener('paste', handleImagePaste, true);
        document.addEventListener('beforeinput', handleImagePaste, true);
        window.addEventListener('paste', handleImagePaste, true);
        window.addEventListener('beforeinput', handleImagePaste, true);

        // Drag and drop handling
        let dragCounter = 0;

        document.addEventListener('dragenter', (e) => {
            e.preventDefault();
            dragCounter++;
            if (dragCounter === 1) {
                dropZone.classList.add('active');
            }
        });

        document.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dragCounter--;
            if (dragCounter === 0) {
                dropZone.classList.remove('active');
            }
        });

        document.addEventListener('dragover', (e) => {
            e.preventDefault();
        });

        async function handleImageDrop(e) {
            e.preventDefault();
            dragCounter = 0;
            dropZone.classList.remove('active');

            const files = imageFilesFromTransfer(e.dataTransfer);
            if (files.length > 0) {
                await uploadImageFiles(files, 'dropped');
            } else {
                setStatus('Please drop an image file', 'error');
            }
        }

        document.addEventListener('drop', handleImageDrop);
        dropZone.addEventListener('dragover', (e) => e.preventDefault());
        dropZone.addEventListener('drop', handleImageDrop);

        async function insertTextIntoTerminal(text) {
            try {
                const response = await fetch(ingressPath('terminal-input'), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text })
                });

                if (!response.ok) {
                    const body = await response.text();
                    console.log('Terminal insert failed:', body);
                    return false;
                }

                const result = await response.json();
                return Boolean(result.success);
            } catch (err) {
                console.log('Terminal insert failed:', err);
                return false;
            }
        }

        // Helper to copy text to clipboard
        async function copyToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                try {
                    await navigator.clipboard.writeText(text);
                    return true;
                } catch (err) {
                    console.log('Clipboard API failed, trying fallback:', err);
                    return fallbackCopyToClipboard(text);
                }
            } else {
                return fallbackCopyToClipboard(text);
            }
        }

        // iOS-compatible fallback clipboard copy using execCommand.
        function fallbackCopyToClipboard(text, clipboardDocument = document) {
            const textArea = clipboardDocument.createElement('textarea');
            textArea.value = text;
            textArea.readOnly = false;
            textArea.contentEditable = 'true';
            textArea.style.position = 'fixed';
            textArea.style.top = '0';
            textArea.style.left = '0';
            textArea.style.width = '1px';
            textArea.style.height = '1px';
            textArea.style.opacity = '0';
            textArea.style.pointerEvents = 'none';
            clipboardDocument.body.appendChild(textArea);

            const selection = clipboardDocument.getSelection?.();
            const range = clipboardDocument.createRange?.();

            textArea.focus({ preventScroll: true });
            if (range && selection) {
                range.selectNodeContents(textArea);
                selection.removeAllRanges();
                selection.addRange(range);
            }
            textArea.setSelectionRange(0, text.length);

            try {
                const copied = clipboardDocument.execCommand('copy');
                clipboardDocument.body.removeChild(textArea);
                selection?.removeAllRanges();
                return copied;
            } catch (err) {
                clipboardDocument.body.removeChild(textArea);
                selection?.removeAllRanges();
                return false;
            }
        }

        function showManualCopy(text, message) {
            manualCopyText.value = text;
            manualCopyMessage.textContent = message || 'Tap and hold to Copy, then paste into the terminal.';
            manualCopyPanel.classList.add('active');
            manualCopyText.focus({ preventScroll: true });
            manualCopyText.select();
        }

        manualCopyDismiss.addEventListener('click', () => {
            manualCopyPanel.classList.remove('active');
        });

        // Forward image paste/drop events over the terminal iframe to the
        // wrapper upload flow. Without this, ttyd/xterm can swallow them before
        // the parent page sees them.
        window.addEventListener('load', () => {
            const iframe = document.getElementById('terminal-frame');
            iframe.addEventListener('dragover', (e) => e.preventDefault());
            iframe.addEventListener('drop', handleImageDrop);
            iframe.addEventListener('paste', handleImagePaste, true);
            iframe.addEventListener('beforeinput', handleImagePaste, true);
            iframe.addEventListener('load', () => {
                try {
                    const iframeDocument = iframe.contentWindow?.document;
                    if (!iframeDocument) {
                        return;
                    }

                    iframeDocument.addEventListener('dragover', (e) => e.preventDefault(), true);
                    iframeDocument.addEventListener('drop', handleImageDrop, true);
                    iframeDocument.addEventListener('paste', handleImagePaste, true);
                    iframeDocument.addEventListener('beforeinput', handleImagePaste, true);

                    if (iframe.contentWindow) {
                        iframe.contentWindow.addEventListener('paste', handleImagePaste, true);
                        iframe.contentWindow.addEventListener('beforeinput', handleImagePaste, true);
                    }
                } catch (err) {
                    console.log('Cannot attach terminal image handlers:', err);
                }
            });
        });

        // ========================================
        // Voice Input with Web Speech API
        // ========================================

        const voiceBtn = document.getElementById('voice-btn');
        const voiceModal = document.getElementById('voice-modal');
        const voiceRecordBtn = document.getElementById('voice-record-btn');
        const voiceCopyBtn = document.getElementById('voice-copy-btn');
        const voiceCloseBtn = document.getElementById('voice-close-btn');
        const voiceTranscript = document.getElementById('voice-transcript');
        const voiceStatus = document.getElementById('voice-status');

        let recognition = null;
        let isRecording = false;

        // Check if Web Speech API is supported
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();

            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US'; // Default to English, can be made configurable

            console.log('Web Speech API is supported!');
        } else {
            console.warn('Web Speech API is not supported in this browser');
            voiceBtn.disabled = true;
            voiceBtn.title = 'Voice input not supported in this browser';
        }

        // Open voice modal
        voiceBtn.addEventListener('click', () => {
            voiceModal.classList.add('active');
            voiceTranscript.textContent = '';
            voiceStatus.textContent = '';
            voiceCopyBtn.style.display = 'none';
        });

        // Close voice modal
        voiceCloseBtn.addEventListener('click', () => {
            if (isRecording) {
                stopRecording();
            }
            voiceModal.classList.remove('active');
        });

        // Click outside modal to close
        voiceModal.addEventListener('click', (e) => {
            if (e.target === voiceModal) {
                if (isRecording) {
                    stopRecording();
                }
                voiceModal.classList.remove('active');
            }
        });

        // Start/Stop recording
        voiceRecordBtn.addEventListener('click', () => {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        });

        function startRecording() {
            if (!recognition) {
                voiceStatus.textContent = '❌ Speech recognition not available';
                voiceStatus.className = 'error';
                return;
            }

            isRecording = true;
            voiceRecordBtn.textContent = 'Stop Recording';
            voiceRecordBtn.className = 'modal-btn modal-btn-danger';
            voiceStatus.textContent = '🎤 Listening... (speak now)';
            voiceStatus.classList.add('listening');
            voiceTranscript.classList.add('listening');

            let finalTranscript = '';
            let interimTranscript = '';

            recognition.onresult = (event) => {
                interimTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;

                    if (event.results[i].isFinal) {
                        finalTranscript += transcript + ' ';
                    } else {
                        interimTranscript += transcript;
                    }
                }

                // Display both final and interim results
                voiceTranscript.textContent = finalTranscript + interimTranscript;

                // Auto-scroll to bottom
                voiceTranscript.scrollTop = voiceTranscript.scrollHeight;
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
                let errorMessage = 'Error: ';

                switch(event.error) {
                    case 'no-speech':
                        errorMessage += 'No speech detected. Try speaking again.';
                        break;
                    case 'audio-capture':
                        errorMessage += 'No microphone found. Check your settings.';
                        break;
                    case 'not-allowed':
                        errorMessage += 'Microphone access denied. Please allow access.';
                        break;
                    default:
                        errorMessage += event.error;
                }

                voiceStatus.textContent = '❌ ' + errorMessage;
                voiceStatus.classList.remove('listening');
                stopRecording();
            };

            recognition.onend = () => {
                if (isRecording) {
                    // Restart if it stops but we're still recording
                    recognition.start();
                }
            };

            try {
                recognition.start();
                console.log('Speech recognition started');
            } catch (err) {
                console.error('Failed to start recognition:', err);
                voiceStatus.textContent = '❌ Failed to start recording';
                isRecording = false;
            }
        }

        function stopRecording() {
            if (!recognition) return;

            isRecording = false;
            recognition.stop();

            voiceRecordBtn.textContent = 'Start Recording';
            voiceRecordBtn.className = 'modal-btn modal-btn-primary';
            voiceStatus.textContent = '✓ Recording stopped';
            voiceStatus.classList.remove('listening');
            voiceTranscript.classList.remove('listening');

            if (voiceTranscript.textContent.trim()) {
                voiceCopyBtn.style.display = 'inline-block';
                voiceStatus.textContent = '✓ Transcript ready! Edit if needed, then copy.';
            }

            console.log('Speech recognition stopped');
        }

        // Copy transcript to clipboard
        voiceCopyBtn.addEventListener('click', async () => {
            const text = voiceTranscript.textContent.trim();

            if (!text) {
                voiceStatus.textContent = '❌ No text to copy';
                return;
            }

            const copied = await copyToClipboard(text);
            if (copied) {
                voiceStatus.textContent = '✓ Copied to clipboard! Paste into terminal.';
                voiceStatus.className = 'success';
            } else {
                showManualCopy(text, 'Tap and hold to Copy this transcript, then paste it into the terminal.');
                voiceStatus.textContent = 'Select the transcript in the copy panel.';
            }
        });

        // Keyboard shortcuts in voice modal
        voiceModal.addEventListener('keydown', (e) => {
            // Escape to close
            if (e.key === 'Escape') {
                if (isRecording) {
                    stopRecording();
                }
                voiceModal.classList.remove('active');
            }

            // Enter to copy (if text exists and not recording)
            if (e.key === 'Enter' && !isRecording && voiceTranscript.textContent.trim()) {
                voiceCopyBtn.click();
            }

            // Space to start/stop recording (if not editing transcript)
            if (e.key === ' ' && e.target !== voiceTranscript) {
                e.preventDefault();
                voiceRecordBtn.click();
            }
        });

        console.log('Voice input module loaded');
    </script>
</body>
</html>
